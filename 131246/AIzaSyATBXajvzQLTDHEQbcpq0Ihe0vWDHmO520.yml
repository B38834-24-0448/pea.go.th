	<item>
		<title>If you have to ask, is it accessible?</title>
		<link>https://webaim.org/blog/if-you-have-to-ask-is-it-accessible/</link>
					<comments>https://webaim.org/blog/if-you-have-to-ask-is-it-accessible/#respond</comments>
		
		<dc:creator><![CDATA[George Joeckel]]></dc:creator>
		<pubDate>Mon, 31 Aug 2026 20:02:26 +0000</pubDate>
				<category><![CDATA[Uncategorized]]></category>
		<guid isPermaLink="false">https://webaim.org/blog/?p=2948</guid>

					<description><![CDATA[As one of the researchers identifying products and tools for inclusion in the NCADEMI EdTech Accessibility Directory, VPATs have been on my mind. Most of the product vendors in the directory that do have VPATs do not provide them publicly, but instead require a potential customer to request the VPAT. This really surprised me, and [&#8230;]]]></description>
										<content:encoded><![CDATA[
<p class="wp-block-paragraph">As one of the researchers identifying products and tools for inclusion in the <a href="https://ncademi.org/provide/directory/" data-type="link" data-id="https://ncademi.org/provide/directory/">NCADEMI EdTech Accessibility Directory</a>, VPATs have been on my mind. Most of the product vendors in the directory that do have VPATs do not provide them publicly, but instead require a potential customer to request the VPAT. This really surprised me, and my gut reaction was &#8220;Why would you allocate resources to creating a VPAT only to create a friction point for someone that is interested in giving you money?&#8221;</p>



<h2 class="wp-block-heading">What is a VPAT?</h2>



<p class="wp-block-paragraph">The&nbsp;Voluntary Product Accessibility Template (VPAT®) is a free template developed by the <a href="https://www.itic.org/policy/accessibility/vpat" data-type="link" data-id="https://www.itic.org/policy/accessibility/vpat">Information Technology Industry Council</a> that translates accessibility requirements and standards (e.g., in Section 508 and other legal frameworks) into actionable testing criteria for products and services. A completed product VPAT is called an Accessibility Conformance Report (ACR), but the terms &#8220;VPAT&#8221; and &#8220;ACR&#8221; are generally used interchangeably.</p>



<h2 class="wp-block-heading">Who is it for?</h2>



<p class="wp-block-paragraph">A <a href="https://www.itic.org/news-events/techwonk-blog/accessible-technology-a-call-for-more-than-the-minimum-in-federal-contracts" data-type="link" data-id="https://www.itic.org/news-events/techwonk-blog/accessible-technology-a-call-for-more-than-the-minimum-in-federal-contracts">2021 ITI post </a>explains the problem the VPAT was created to solve:</p>



<blockquote class="wp-block-quote is-layout-flow wp-block-quote-is-layout-flow">
<p class="wp-block-paragraph">Many employees living with disabilities rely on internet-, hardware-, and software-based accessibility solutions to help empower them in their workplaces. Although minimum <a href="https://www.section508.gov/manage/laws-and-policies" target="_blank" rel="noreferrer noopener">U.S.-based</a> and <a href="https://www.etsi.org/deliver/etsi_en/301500_301599/301549/03.01.01_60/en_301549v030101p.pdf" target="_blank" rel="noreferrer noopener">international</a> legal standards exist for accessible technologies, determining whether a product will fully meet employees’ needs can be challenging.</p>
</blockquote>



<p class="wp-block-paragraph">A VPAT can be used by potential users or customers of a product to provide insight into the accessibility of that product.</p>



<h2 class="wp-block-heading">Reasons for requiring customers to request a VPAT?</h2>



<p class="wp-block-paragraph">To gain some insight into the vendor perspective, I asked a number of AI Agents to answer this question:</p>



<blockquote class="wp-block-quote is-layout-flow wp-block-quote-is-layout-flow">
<p class="wp-block-paragraph">&#8220;Why might a vendor legitimately need to require a potential client to request a product&#8217;s VPAT?&#8221;</p>
</blockquote>



<p class="wp-block-paragraph">I synthesized the results into the top three categories: <strong>customized information</strong>, <strong>competitive information</strong>, and <strong>correct information</strong>. Below are hypothetical statements that might represent a vendor&#8217;s concerns from each of these categories followed by a response to those statements.</p>



<h2 class="wp-block-heading">Customized Information</h2>



<blockquote class="wp-block-quote is-layout-flow wp-block-quote-is-layout-flow">
<p class="wp-block-paragraph">We have an extensive list of products and need to make sure that potential customers have the right information based on which version or configuration of a product they are considering.</p>
</blockquote>



<p class="wp-block-paragraph">The VPAT template encourages vendors to indicate the relevant product version or configuration. In cases where accessibility is not substantively different across multiple versions or configurations, the VPAT can be scoped to document accessibility across these. This concern can best be addressed by vendors providing current and properly scoped VPATs rather than shifting the burden on potential customers to request these.</p>



<h2 class="wp-block-heading">Competitive Information</h2>



<blockquote class="wp-block-quote is-layout-flow wp-block-quote-is-layout-flow">
<p class="wp-block-paragraph">We can&#8217;t make proprietary information available publicly. We even require prospects to sign a non-disclosure agreement (NDA).</p>
</blockquote>



<p class="wp-block-paragraph">The California State University San Marcos addresses this directly on their <a href="https://www.csusm.edu/iits/services/accessibility/services/procurement/vpat.html" data-type="link" data-id="https://www.csusm.edu/iits/services/accessibility/services/procurement/vpat.html">VPAT Vendor Requirements</a> page:</p>



<blockquote class="wp-block-quote is-layout-flow wp-block-quote-is-layout-flow">
<p class="wp-block-paragraph">A VPAT does not contain or disclose proprietary information; instead, quality VPATs will faithfully represent a product&#8217;s current accessibility conformance, whether accessible or inaccessible.<br><br>The current accessibility conformance of any product is readily available to anyone accessing a product&#8217;s interface, and as such,&nbsp;<strong>CSUSM will not sign vendor NDAs to receive accessibility conformance documentation</strong>.</p>
</blockquote>



<h2 class="wp-block-heading">Correct Information</h2>



<blockquote class="wp-block-quote is-layout-flow wp-block-quote-is-layout-flow">
<p class="wp-block-paragraph">We sell our products to customers from a range of countries across public and private industries. We need to make sure that our prospects get the right information.</p>
</blockquote>



<p class="wp-block-paragraph">Providing information to diverse customers can generally be addressed by the four editions of the VPAT—508, EU/EN 301 549, WCAG, and International—each aligned to different standards and contract requirements, and separate WCAG-version variants within those. In addition to providing VPATs, vendors can readily provide their prospects with additional guidance and information.</p>



<h2 class="wp-block-heading">Is this really a pervasive issue?</h2>



<p class="wp-block-paragraph">Given that the <a href="https://ncademi.org/provide/directory/" data-type="link" data-id="https://ncademi.org/provide/directory/">EdTech Accessibility Directory</a> project I&#8217;m working on only has 60 published products to date, I decided to gather some additional data. I generated a list of over 231 K-12 products that had at least &#8220;moderate usage&#8221; based on some AI-driven research. I then used Google Gemini to analyze these product&#8217;s web pages and documentation for VPAT references.<br><br>Of the 186 unique vendors across the 231 products, a reference to VPAT information was only detected for 35—about 1 in 5 (19%). And among these 35 vendors, more than 1 in 5 of them (22%) required a prospect to request a VPAT rather than posting the VPAT publicly. While not a substantive assessment, this AI-driven research does suggest that access to product VPATs may be a challenge.</p>



<h2 class="wp-block-heading">What about the vendors that did provide a VPAT?</h2>



<p class="wp-block-paragraph">I wish I had better news to share here. While the early stages of the directory still has a limited set of products, of the 27 vendors thus far that have provided public access to their VPATs (thus implicitly demonstrating an awareness of accessibility guidelines), 6 of them provided VPAT documents that failed an accessibility evaluation<br><br>While publishing a VPAT does not mean that the relevant product is accessible, I want to acknowledge the 21 K12 EdTech vendors that did provide publicly-available, accessible VPATs!</p>



<ul class="wp-block-list">
<li><a href="https://www.adobe.com">Adobe</a> (Acrobat) </li>



<li><a href="https://bookcreator.com">Book Creator</a></li>



<li><a href="https://www.brainingcamp.com">Braining Camp</a></li>



<li><a href="https://code.org">Code.org</a></li>



<li><a href="https://cograder.com">CoGrader</a></li>



<li><a href="https://www.desmos.com">Desmos</a></li>



<li><a href="https://www.ebsco.com">EBSCO Information Services</a></li>



<li><a href="https://edpuzzle.com">Edpuzzle</a></li>



<li><a href="https://edu.google.com/workspace-for-education/classroom/">Google Classroom</a></li>



<li><a href="https://www.instructure.com">Instructure</a> (Canvas LMS) </li>



<li><a href="https://kahoot.com">Kahoot!</a></li>



<li><a href="https://education.lego.com">LEGO Education</a></li>



<li><a href="https://www.mathplayground.com">Math Playground</a></li>



<li><a href="https://www.microsoft.com">Microsoft</a></li>



<li><a href="https://newsela.com">Newsela</a></li>



<li><a href="https://www.ngpf.org">Next Gen Personal Finance (NGPF)</a></li>



<li><a href="https://progresslearning.com">Progress Learning</a><a href="https://www.pltw.org">Project Lead The Way (PLTW)</a></li>



<li><a href="https://www.swank.com">Swank Motion Pictures</a> (Swank Digital Campus) </li>



<li><a href="https://www.typing.com">Typing.com</a> (Teaching.com) </li>



<li><a href="https://www.wevideo.com">WeVideo</a></li>
</ul>



<h2 class="wp-block-heading">Where do we go from here?</h2>



<p class="wp-block-paragraph">The infrastructure for doing this right already exists. <a href="https://acreditor.section508.gov/" data-type="link" data-id="https://acreditor.section508.gov/">OpenACR</a>, built by <a href="https://www.gsa.gov/" data-type="link" data-id="https://www.gsa.gov/">GSA</a> and <a href="https://civicactions.com/" data-type="link" data-id="https://civicactions.com/">CivicActions</a>, turns VPAT data into searchable YAML and JSON so buyers can compare vendors instead of digging through VPATs individually. Education institutions that take this seriously already expect more than a bare VPAT—best practice pairs it with a plain-language accessibility statement and, where a product only partially supports critical criteria, a remediation roadmap with an actual timeline.<br><br>Please share your experiences and thoughts in the comments below.<br><br></p>
]]></content:encoded>
					
					<wfw:commentRss>https://webaim.org/blog/if-you-have-to-ask-is-it-accessible/feed/</wfw:commentRss>
			<slash:comments>0</slash:comments>
		
		
			</item>
		<item>
		<title>An Extension is Not an Excuse</title>
		<link>https://webaim.org/blog/an-extension-is-not-an-excuse/</link>
		
		<dc:creator><![CDATA[John Northup]]></dc:creator>
		<pubDate>Thu, 28 May 2026 21:20:02 +0000</pubDate>
				<category><![CDATA[Uncategorized]]></category>
		<guid isPermaLink="false">https://webaim.org/blog/?p=2946</guid>

					<description><![CDATA[The Department of Health and Human Services recently announced a one-year extension of the compliance dates for web content and mobile app accessibility requirements under Section 504 of the Rehabilitation Act. The requirements themselves are not new in substance: covered recipients of HHS federal financial assistance must make covered web content and mobile apps conform [&#8230;]]]></description>
										<content:encoded><![CDATA[
<p class="wp-block-paragraph">The Department of Health and Human Services recently announced a <a href="https://public-inspection.federalregister.gov/2026-09266.pdf">one-year extension of the compliance dates for web content and mobile app accessibility requirements</a> under Section 504 of the Rehabilitation Act. The requirements themselves are not new in substance: covered recipients of HHS federal financial assistance must make covered web content and mobile apps conform to WCAG 2.1 Level AA. What changed is the timeline. Recipients with 15 or more employees now have until May 11, 2027, and recipients with fewer than 15 employees now have until May 10, 2028. This follows an almost identical extension for ADA Title II.</p>



<p class="wp-block-paragraph">For many accessibility advocates, this delay is understandably frustrating. People with disabilities have already waited far too long for equal access to digital services. Another year is not an abstraction. It may mean another year of inaccessible patient portals, appointment systems, application forms, mobile apps, PDFs, and online health information. These are not minor inconveniences. In many cases, these are the digital front doors to health care, public benefits, education, social services, and other essential programs.</p>



<p class="wp-block-paragraph">It is also fair to ask why more time should be necessary. WCAG 1.0 has been around as long as anyone up to age 30 can remember. WCAG 2.0 has been with us since 2008. WCAG 2.1, the standard adopted in the HHS rule, was published in 2018. The web has been redesigned, rebuilt, replatformed, rebranded, and relaunched many times since then. Every inaccessible redesign has been a lost opportunity. Every inaccessible PDF uploaded last week is not a relic of the 1990s. Every new form that cannot be completed with a keyboard, every button without an accessible name, every low-contrast interface, and every inaccessible mobile app workflow represents a choice, whether intentional or not, to continue excluding some users.</p>



<p class="wp-block-paragraph">Recent data make the frustration even sharper. As my colleague, Christopher Phillips, reported in this space last month, the 2026 WebAIM Million report found that among the top one million website home pages, <a href="https://webaim.org/blog/tolerating-inaccessibility/">the average number of WAVE-detected accessibility errors rose about 10% from 2025 to 2026</a>. Christopher rightly notes that this means the web became less accessible than it was a year ago, at least by this measure.</p>



<p class="wp-block-paragraph">That should bother us. It is difficult to ask disabled users for patience when the broader web is not merely moving slowly, but in some measurable ways moving backward. Patience is much easier to request from the people who are not blocked by the form, the portal, the document, or the checkout process.</p>



<p class="wp-block-paragraph">And yet, there is another reality that accessibility professionals encounter every day. Organizations are not simply sitting on a secret pile of accessible code and choosing not to deploy it. Some website owners only recently learned what digital accessibility requires. Some built their sites quickly with low-cost tools. Some bought scheduling systems, patient portals, learning management systems, donation platforms, document management systems, or mobile apps without realizing that accessibility would become a serious barrier later. Some inherited thousands of inaccessible PDFs. Some have only one person responsible for the website, and that person may also be responsible for communications, social media, IT support, and refilling the copier paper when it jams.</p>



<p class="wp-block-paragraph">This does not excuse inaccessibility. It does help explain why meaningful accessibility work can take time.</p>



<p class="wp-block-paragraph">HHS itself points to practical concerns that many organizations face. The Department notes that recipients vary widely in size, resources, location, technical support, and mission. It also cites concerns about the time and cost of PDF remediation, uncertainty about how compliance will be measured, and the difficulty of ensuring that third-party contractors make web content conform to WCAG 2.1.</p>



<p class="wp-block-paragraph">Anyone who has worked in accessibility consulting will recognize those issues. Accessibility is not usually fixed by one person running one automated scan on one afternoon. Real progress often requires auditing, remediation, design changes, development changes, content changes, procurement changes, staff training, vendor pressure, policy updates, and ongoing monitoring. Organizations must not only fix what already exists; they must also stop creating new barriers. That is often the harder cultural shift.</p>



<p class="wp-block-paragraph">So yes, some organizations need time. But time for what? A deadline extension may be understandable as a practical matter, but it is only defensible if the additional year is used for meaningful progress. It must not become another year of waiting, deferring, debating, or hoping the problem will somehow become smaller on its own.</p>



<p class="wp-block-paragraph">The HHS notice includes one comment that should stop us cold. A virtual mental health care provider argued that the 2024 rule would impose substantial financial burdens on health care providers “without providing any material benefits.” HHS explicitly disagreed, noting that especially in telehealth, if a person with a disability cannot access the web content or a mobile app from a telehealth provider receiving federal funds, this is not just a technical issue, but a denial of health care by a recipient of federal dollars.</p>



<p class="wp-block-paragraph">That phrase, “without providing any material benefits,” reveals the deeper problem. Accessibility can look optional only when the people excluded by inaccessible systems are treated as invisible. For a health care provider, the material benefit should be obvious: patients can get care.</p>



<p class="wp-block-paragraph">This is where organizations need to be honest with themselves. The legal deadline may have moved, but the human needs did not. A blind patient who cannot use a provider’s portal does not become less blind because the compliance date changed. A person with limited dexterity who cannot complete an online form does not receive better service because the organization has another year. A Deaf patient who needs accessible video content, a low-vision user who needs sufficient contrast and text resizing, or a screen reader user who needs a properly labeled form field is not asking for advanced features. They are asking to use the service.</p>



<p class="wp-block-paragraph">The extension should therefore be treated not as a reprieve from accessibility, but as a reprieve from panic. Panic produces rushed audits, superficial fixes, inaccessible redesigns, and the kind of magical thinking that leads people to believe that one simplistic overlay can solve years of inaccessible design and development. A thoughtful year can produce something much better: a prioritized plan, trained staff, better procurement practices, improved templates, cleaner content workflows, more accessible third-party systems, and measurable reduction of barriers.</p>



<p class="wp-block-paragraph">Organizations that are covered by these requirements should use the additional time wisely.</p>



<p class="wp-block-paragraph">First, prioritize the services that matter most. Not every page, document, or app screen has the same immediate impact. Appointment scheduling, patient intake forms, benefit applications, payment systems, contact forms, complaint processes, emergency information, and required documents should rise to the top. If a barrier prevents someone from receiving care or participating in a program, it should not wait until the end of the project plan.</p>



<p class="wp-block-paragraph">Second, stop creating new inaccessible content. An organization that spends the next year remediating old PDFs while continuing to publish new inaccessible PDFs is bailing water with the faucet still running. Templates, authoring practices, document workflows, and publishing permissions all matter.</p>



<p class="wp-block-paragraph">Third, take procurement seriously. Many accessibility problems enter organizations through third-party products. Website platforms, form builders, scheduling systems, mobile apps, map widgets, payment processors, document systems, and embedded media players can all create barriers. Organizations should ask vendors direct questions, require credible accessibility documentation (such as a VPAT), include accessibility in contracts, and test important workflows before purchase. “Our vendor handles that” is not a strategy unless the vendor actually handles it.</p>



<p class="wp-block-paragraph">Fourth, train the people who create and maintain the content. Accessibility cannot live only with the web developer or an outside consultant. The person who writes headings, adds links, uploads PDFs, creates social media graphics, posts videos, or builds forms can either reduce barriers or multiply them. Basic training for content authors can prevent many common problems before they reach the public.</p>



<p class="wp-block-paragraph">Finally, measure progress honestly. No organization will fix everything in the first month. But by the end of the next year, organizations should be able to show what they tested, what they fixed, what remains, who is responsible, and how accessibility will be maintained. Progress does not need to be perfect, but it does need to be real.</p>



<p class="wp-block-paragraph">The disability community has heard promises before. “We need more time” is only credible when it is paired with action. “We are working on it” only means something when barriers are actually being removed. The deadline moved. The civil rights obligation did not. For organizations that are serious about accessibility, the approach should not be how little they can do before 2027 or 2028, but <em>how much</em>.</p>
]]></content:encoded>
					
		
		
			</item>
		<item>
		<title>Tolerating Inaccessibility</title>
		<link>https://webaim.org/blog/tolerating-inaccessibility/</link>
					<comments>https://webaim.org/blog/tolerating-inaccessibility/#comments</comments>
		
		<dc:creator><![CDATA[Christopher Phillips]]></dc:creator>
		<pubDate>Thu, 30 Apr 2026 17:50:24 +0000</pubDate>
				<category><![CDATA[Uncategorized]]></category>
		<guid isPermaLink="false">https://webaim.org/blog/?p=2896</guid>

					<description><![CDATA[The latest WebAIM Million report shows that detectable homepage accessibility errors increased over the past year. This article considers what those results may reveal about the organizational and societal forces that continue to deprioritize accessibility, and challenges us to imagine a world where inaccessibility is no longer tolerated.]]></description>
										<content:encoded><![CDATA[
<p class="wp-block-paragraph">The&nbsp;recent&nbsp;<a href="https://webaim.org/projects/million/" target="_blank" rel="noreferrer noopener">2026 WebAIM Million report</a>&nbsp;showed that across the top 1,000,000 websites,&nbsp;the number of distinct accessibility errors detected by WAVE rose from 51&nbsp;in the 2025 report&nbsp;to 56.1.&nbsp;&nbsp;Despite an&nbsp;<a href="https://trends.google.com/explore?q=%2522digital%2520accessibility%2522&amp;date=today%205-y&amp;geo=US" target="_blank" rel="noreferrer noopener">increase in interest</a>&nbsp;and the tireless efforts of digital accessibility professionals all over the world,&nbsp;the data&nbsp;indicate&nbsp;that&nbsp;the&nbsp;web is less accessible&nbsp;than it was&nbsp;a year ago.&nbsp;</p>



<p class="wp-block-paragraph">It is disheartening to acknowledge such a significant setback from hard-won progress, but&nbsp;I’m&nbsp;hopeful this can also be an opportunity to consider what we might do differently going forward. The hardest thing for&nbsp;me&nbsp;about the latest report is the reminder that we live in a world where it&nbsp;remains&nbsp;broadly acceptable (or at least tolerable) that the top one million home pages average&nbsp;<strong>56.1 potential barriers</strong>&nbsp;for&nbsp;<em>a specific group of people</em>.&nbsp;Why is widespread inaccessibility still acceptable for disabled users?</p>



<p class="wp-block-paragraph">I have felt unsettled recently by the adage, “Every system is perfectly designed to get the results it gets.” The lack of digital accessibility is the result of a system that was clearly not designed to prioritize accessibility. That said, how do we&nbsp;impact&nbsp;systemic change, and what “system” are we even talking about?</p>



<p class="wp-block-paragraph">There is important work already underway to incorporate accessibility more into processes related to training,&nbsp;purchasing&nbsp;practices, hiring processes, technical standards, and policy. This work is essential, but why is accessibility missing from so many of those systems in the first place?&nbsp;&nbsp;&nbsp;</p>



<p class="wp-block-paragraph">Digital inaccessibility is often framed as an awareness, technical, training, or legal problem—and it is&nbsp;all of&nbsp;those things. But that is only part of the story; accessibility barriers persist not only because of&nbsp;these&nbsp;challenges, but also because their impact on disabled users&nbsp;remains&nbsp;easy for so many organizations to overlook.&nbsp;&nbsp;&nbsp;</p>



<p class="wp-block-paragraph">There is ample evidence of people with disabilities being treated differently than people without disabilities in employment, education, housing, and healthcare. Findings from the&nbsp;WebAIM&nbsp;Million project are consistent with broader societal patterns where accessibility is too often ranked below so many other competing priorities.</p>



<h2 class="wp-block-heading">Where Do We Go From Here? </h2>



<p class="wp-block-paragraph">Approaching accessibility from a disability rights framework is not new, but it is important to remember that the work&nbsp;we&nbsp;are doing as digital accessibility&nbsp;practitioners&nbsp;is part of a much larger movement that has been doing this work for&nbsp;a very long&nbsp;time. There are so many people and organizations doing incredible work to break down barriers in other areas that we can work with and learn from.&nbsp;&nbsp;</p>



<p class="wp-block-paragraph">It is incredibly frustrating to see the same set of common issues persist year after year, when so many proven&nbsp;technical solutions&nbsp;are readily available. When we recognize that web accessibility is not only a technical challenge,&nbsp;we can&nbsp;explore new ways to address the cultural, organizational, and moral forces that allow barriers to persist. Consider for example:</p>



<ul start="1" class="wp-block-list">
<li>What can we learn from groups like&nbsp;<a href="https://adapt.org/" target="_blank" rel="noreferrer noopener">ADAPT</a>&nbsp;and&nbsp;their&nbsp;<a href="https://www.chicagohistory.org/adapt-protesting-for-disability-rights/" target="_blank" rel="noreferrer noopener">fight for accessible transportation</a>?&nbsp;&nbsp;</li>



<li>How did the disability rights community organize, and what key events led to the passage of the&nbsp;<a href="https://www.eeoc.gov/rehabilitation-act-1973" target="_blank" rel="noreferrer noopener">Rehabilitation Act of 1973</a>? What happened from there to lay the groundwork for the&nbsp;<a href="https://www.ada.gov/" target="_blank" rel="noreferrer noopener">Americans with Disabilities Act</a>?</li>



<li>What are the top priorities of disability advocacy organizations today?&nbsp;&nbsp;</li>
</ul>



<p class="wp-block-paragraph">Change can happen, but moving beyond the status quo of inaccessibility tolerance will require broader and more human-centered approaches. The work required for this type of change is different, messier, and often doesn’t yield immediate results—but consider what it would look like to do digital accessibility work in a world that no longer tolerates inaccessibility. That is something to get excited about!</p>
]]></content:encoded>
					
					<wfw:commentRss>https://webaim.org/blog/tolerating-inaccessibility/feed/</wfw:commentRss>
