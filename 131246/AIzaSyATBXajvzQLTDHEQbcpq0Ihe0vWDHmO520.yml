'''Git''' ({{IPAc-en|g|ɪ|t|audio=en-uk-git.ogg}}<ref name=":0">{{Cite AV media |url=https://www.youtube.com/watch?v=4XpnKHJAok8&t=1m30s |title=Tech Talk: Linus Torvalds on git |date=14 May 2007 |time=00:01:30 |access-date=2014-07-20 |archive-url=https://web.archive.org/web/20151220133030/https://www.youtube.com/watch?v=4XpnKHJAok8&t=1m30s |archive-date=20 December 2015 |url-status=live |via=[[YouTube]]}}</ref>) is a [[distributed version control]] [[software system]]{{sfn | Chacon | Straub | 2014 | pp=29-31}} that is capable of [[Version control|managing versions]] of source code or data. It is often used to control [[source code]] by [[programmer]]s who are [[software development|developing]] software [[Collaborative development environment|collaboratively]]. It was originally created by [[Linus Torvalds]] for version control in the development of the [[Linux kernel]].<ref name="pro-git-1.2">{{cite book |url=https://git-scm.com/book/en/v2 |title=Pro Git |date=2014 |publisher=Apress |edition=2nd |chapter=A Short History of Git |access-date=26 December 2015 |chapter-url=https://git-scm.com/book/en/v2/Getting-Started-A-Short-History-of-Git |archive-url=https://web.archive.org/web/20151225223054/http://git-scm.com/book/en/v2 |archive-date=25 December 2015 |url-status=live}}</ref>

Design goals of Git include speed, [[data integrity]], and support for [[Distributed computing|distributed]], [[Non-linear editing|non-linear]] workflows—thousands of parallel [[Branching (version control)|branches]] running on different computers.<ref name="kernel_SCM_saga">{{cite mailing list |mailing-list = linux-kernel |last = Torvalds |first = Linus |url = https://marc.info/?l=linux-kernel&m=111288700902396 |title = Re: Kernel SCM saga... |date = 2005-04-07 |access-date = 3 February 2017 |archive-date = 1 July 2019 |archive-url = https://web.archive.org/web/20190701210808/https://marc.info/?l=linux-kernel |url-status = live }} "So I'm writing some scripts to try to track things a whole lot faster."</ref><ref name="integrity_goals">{{cite mailing list |last = Torvalds |first = Linus |author-link = Linus Torvalds |mailing-list = git |date = 2007-06-10 |title = Re: fatal: serious inflate inconsistency |url = https://marc.info/?l=git&m=118143549107708 |access-date = 3 February 2017 |archive-date = 28 December 2022 |archive-url = https://web.archive.org/web/20221228015439/http://marc.info/?l=git&m=118143549107708 |url-status = live }}</ref><ref name="linusGoogleTalk">{{Cite AV media |people = Linus Torvalds |date = 2007-05-03 |url = https://www.youtube.com/watch?v=4XpnKHJAok8 |title = Google tech talk: Linus Torvalds on git |time = 02:30 |access-date = 2007-05-16 |url-status = live |archive-url = https://web.archive.org/web/20070528041814/http://www.youtube.com/watch?v=4XpnKHJAok8 |archive-date = 28 May 2007}}</ref>

As with most other distributed version control systems, and unlike most [[client–server]] systems, Git maintains a local copy of the entire [[Repository (version control)|repository]], also known as the "repo", with history and version-tracking abilities, independent of [[Computer network|network]] access or a central [[Server (computing)|server]]. A repository is stored on each computer in a standard [[directory (computing)|directory]] with additional, [[Hidden file and hidden directory|hidden files]] to provide version control capabilities.<ref>{{cite book |last1 = Chacon |first1 = Scott |title = Pro Git |date = 24 December 2014 |publisher = [[Apress]] |location = New York, NY |isbn = 978-1-4842-0077-3 |pages = 29–30 |edition = 2nd |url = https://git-scm.com/book/en/v2 |url-status = live |archive-url = https://web.archive.org/web/20151225223054/http://git-scm.com/book/en/v2 |archive-date = 25 December 2015}}</ref> Git provides features to [[Synchronization (computer science)|synchronize]] changes between repositories that share history; for asynchronous collaboration, this extends to repositories on remote machines. Although all repositories (with the same history) are peers, developers often use a central server to host a repository to hold an integrated copy.

Today, Git is the version control system most commonly used by software developers. It is the most popular distributed version control system,<ref>{{Cite web |last=Shirey |first=Russell G. |date=March 1, 2015 |title=Git as an Encrypted Distributed Version Control System |url=https://apps.dtic.mil/sti/pdfs/ADA619785.pdf |access-date=July 13, 2025 |website=[[Defense Technical Information Center]] |page=38}}</ref><ref>{{cite arXiv | last1=Knüpfer | first1=Andreas | last2=Callow | first2=Timothy J. | title=Data Version Management and Machine-Actionable Reproducibility for HPC based on git and DataLad | date=2025 | class=cs.DC | eprint=2505.06558 }}</ref> with nearly 95% of developers reporting it as their primary version control system as of 2022.<ref name=":1" /> It is the most widely used source-code management tool among professional developers. Several different [[Software forge|software forges]] offer Git repository services, including [[GitHub]], [[SourceForge]], [[Bitbucket]] and [[GitLab]].<ref name="Krill 2016">{{cite web |last=Krill |first=Paul |date=28 September 2016 |title=Enterprise repo wars: GitHub vs. GitLab vs. Bitbucket |url=https://www.infoworld.com/article/3123244/enterprise-repo-wars-github-vs-gitlab-vs-bitbucket.html |access-date=2 February 2020 |website=InfoWorld |archive-date=2 February 2020 |archive-url=https://web.archive.org/web/20200202221355/https://www.infoworld.com/article/3123244/enterprise-repo-wars-github-vs-gitlab-vs-bitbucket.html |url-status=live }}</ref><ref name="Alexa github.com" /><ref name="Alexa sourceforge.net" /><ref name="Alexa bitbucket.org" /><ref name="Alexa gitlab.com" />

==History==
Torvalds started developing Git in April 2005 after the free [[Software license|license]] for [[BitKeeper]], the proprietary [[Version control|source-control management]] (SCM) system used for Linux kernel development since 2002, was revoked for Linux.<ref>{{cite news |last=Brown |first=Zack |date=2018-07-27 |title=A Git Origin Story |work=Linux Journal |publisher=Linux Journal |url=https://www.linuxjournal.com/content/git-origin-story |url-status=live |access-date=2020-05-28 |archive-url=https://web.archive.org/web/20200413113107/https://www.linuxjournal.com/content/git-origin-story |archive-date=2020-04-13}}</ref><ref name="linux.com441473">{{Cite web |date=2005-04-11 |title=BitKeeper and Linux: The end of the road? |url=https://www.linux.com/news/bitkeeper-and-linux-end-road/ |access-date=2023-05-18 |website=Linux.com |language=en-US}}</ref> The copyright holder of BitKeeper, [[Larry McVoy]], claimed that [[Andrew Tridgell]] had created [[SourcePuller]] by [[reverse engineering]] the BitKeeper [[Communication protocol|protocols]].<ref>{{cite news |last= McAllister |first= Neil |url= http://www.infoworld.com/article/2670360/operating-systems/linus-torvalds--bitkeeper-blunder.html |title= Linus Torvalds' BitKeeper blunder |work= InfoWorld |date= 2005-05-02 |access-date= 2015-09-08 |url-status= live |archive-url= https://web.archive.org/web/20150826064920/http://www.infoworld.com/article/2670360/operating-systems/linus-torvalds--bitkeeper-blunder.html |archive-date= 26 August 2015}}</ref> The same incident also spurred the creation of [[Mercurial]], another version-control system.

Torvalds wanted a distributed system that he could use like BitKeeper, but none of the available free systems met his needs. He cited an example of a source-control management system needing 30 seconds to apply a patch and update all associated metadata, and noted that this would not scale to the needs of Linux kernel development, where synchronizing with fellow maintainers could require 250 such actions at once. For his design criterion, he specified that patching should take no more than three seconds, and added three more goals:<ref name="kernel_SCM_saga"/>
* Take the [[Concurrent Versions System]] (CVS) as an example of what ''not'' to do; if in doubt, make the exact opposite decision.<ref name="linusGoogleTalk"/>
* Support a distributed, BitKeeper-like workflow.<ref name="linusGoogleTalk"/>
* Include very strong safeguards against corruption, either accidental or malicious.<ref name="integrity_goals"/>

These criteria eliminated every version-control system in use at the time, so immediately after the 2.6.12-rc2 Linux kernel development release, Torvalds set out to write his own.<ref name="linusGoogleTalk"/>

The development of Git began on 3 April 2005.<ref name="selfhost">{{cite mailing list |url=https://marc.info/?l=git&m=117254154130732 |title=Re: Trivia: When did git self-host? |date=2007-02-27 |last=Torvalds |first=Linus |mailing-list=git |access-date=3 February 2017 |archive-date=8 April 2023 |archive-url=https://web.archive.org/web/20230408033443/https://marc.info/?l=git&m=117254154130732 |url-status=live }}</ref> Torvalds announced the project on 6 April and became [[Self-hosting (compilers)|self-hosting]] the next day.<ref name="selfhost"/><ref>{{cite mailing list |url=https://marc.info/?l=linux-kernel&m=111280216717070 |title=Kernel SCM saga.. |date=2005-04-06 |last=Torvalds |first=Linus |mailing-list=linux-kernel |access-date=3 February 2017 |archive-date=8 June 2023 |archive-url=https://web.archive.org/web/20230608075039/https://marc.info/?l=linux-kernel&m=111280216717070 |url-status=live }}</ref> The first merge of multiple branches took place on 18 April.<ref>{{cite mailing list |url=https://marc.info/?l=git&m=111377572329534 |title=First ever real kernel git merge! |date=2005-04-17 |last=Torvalds |first=Linus |mailing-list=git |access-date=3 February 2017 |archive-date=15 August 2021 |archive-url=https://web.archive.org/web/20210815152704/https://marc.info/?l=git&m=111377572329534 |url-status=live }}</ref> Torvalds achieved his performance goals; on 29 April, the nascent Git was benchmarked recording patches to the Linux kernel tree at a rate of 6.7 patches per second.<ref>{{cite mailing list |url=https://marc.info/?l=git&m=111475459526688 |title=Mercurial 0.4b vs git patchbomb benchmark |date=2005-04-29 |last=Mackall |first=Matt |mailing-list=git |access-date=3 February 2017 |archive-date=15 August 2021 |archive-url=https://web.archive.org/web/20210815164509/https://marc.info/?l=git&m=111475459526688 |url-status=live }}</ref> On 16 June, Git managed the kernel 2.6.12 release.<ref>{{cite mailing list |url=https://marc.info/?l=git-commits-head&m=111904216911731 |title=Linux 2.6.12 |date=2005-06-17 |last=Torvalds |first=Linus |mailing-list=git-commits-head}}</ref>

Torvalds turned over [[software maintenance|maintenance]] on 26 July 2005 to Junio Hamano, a major contributor to the project.<ref>{{cite mailing list |url=https://marc.info/?l=git&m=112243466603239 |title=Meet the new maintainer.. |date=2005-07-27 |last=Torvalds |first=Linus |mailing-list=git |access-date=3 February 2017 |archive-date=15 August 2021 |archive-url=https://web.archive.org/web/20210815205338/https://marc.info/?l=git&m=112243466603239 |url-status=live }}</ref> Hamano was responsible for the 1.0 release on 21 December 2005.<ref>{{cite mailing list |url=https://marc.info/?l=git&m=113515203321888 |title=Announce: Git 1.0.0 |date=2005-12-21 |last=Hamano |first=Junio C. |mailing-list=git |access-date=3 February 2017 |archive-date=16 August 2021 |archive-url=https://web.archive.org/web/20210816110910/https://marc.info/?l=git&m=113515203321888 |url-status=live }}</ref>

===Naming===
Torvalds quipped about the name ''[[Git (slang)|git]]'' (which is [[British English]] slang for an unpleasant or silly person): "I'm an egotistical bastard, and I name all my projects after myself. First '[[Linux kernel|Linux]]', now 'git'."<ref name="whythegitname">{{cite web
 | url         = https://git.wiki.kernel.org/index.php/GitFaq#Why_the_.27Git.27_name.3F
 | title       = GitFaq: Why the 'Git' name?
 | publisher   = Git.or.cz
 | access-date = 2012-07-14
 | url-status  = live
 | archive-url  = https://web.archive.org/web/20120723224559/https://git.wiki.kernel.org/index.php/GitFaq#Why_the_.27Git.27_name.3F
 | archive-date = 23 July 2012}}</ref><ref>{{cite web |url= http://www.pcworld.idg.com.au/article/129776/after_controversy_torvalds_begins_work_git_/ |title= After controversy, Torvalds begins work on 'git' |date= 2012-07-14 |work= PC World |quote= [[Linus Torvalds|Torvalds]] seemed aware that his decision to drop BitKeeper would also be controversial. When asked why he called the new software, 'git', [[British English|British]] slang meaning 'a rotten person', he said. 'I'm an egotistical bastard, so I name all my projects after myself. First Linux, now git.' |url-status= dead |archive-url= https://web.archive.org/web/20110201184934/http://www.pcworld.idg.com.au/article/129776/after_controversy_torvalds_begins_work_git_/ |archive-date= 1 February 2011}}</ref> The [[man page]] describes Git as "the stupid content tracker".<ref>{{cite web |url= https://git-scm.com/docs/git.html |title= git(1) Manual Page |access-date= 2012-07-21 |url-status= live |archive-url= https://web.archive.org/web/20120621133627/http://www.git-scm.com/docs/git.html |archive-date= 21 June 2012}}</ref>

The [[README|read-me file]] of the source code elaborates further:<ref>{{cite web |title= Initial revision of 'git', the information manager from hell · git/git@e83c516 |url= https://github.com/git/git/blob/e83c5163316f89bfbde7d9ab23ca2e25604af290/README |website= GitHub |access-date= 2016-01-21 |url-status= live |archive-url= https://web.archive.org/web/20171008211145/https://github.com/git/git/blob/e83c5163316f89bfbde7d9ab23ca2e25604af290/README |archive-date= 8 October 2017}}</ref>

{{Blockquote|"git" can mean anything, depending on your mood.
* Random three-letter combination that is pronounceable, and not actually used by any common UNIX command. The fact that it is a mispronunciation of "get" may or may not be relevant.
* Stupid. Contemptible and despicable. Simple. Take your pick from the dictionary of slang.
* "Global information tracker": you're in a good mood, and it actually works for you. Angels sing, and a light suddenly fills the room.
* "Goddamn idiotic truckload of sh*t": when it breaks.
}}

The source code for Git refers to the program as "the information manager from hell".<ref>{{Cite web |title=git/usage.c at master · git/git |url=https://github.com/git/git/blob/master/usage.c |access-date=11 July 2025 |website=[[GitHub]] |language=en |archive-date=26 February 2025 |archive-url=https://web.archive.org/web/20250226164835/https://github.com/git/git/blob/master/usage.c |url-status=live }}</ref><ref>{{Cite web |last=Torvalds |first=Linus |date=7 April 2005 |title=Initial revision of "git", the information manager from hell · git/git@e83c516 |url=https://github.com/git/git/commit/e83c5163316f89bfbde7d9ab23ca2e25604af290 |access-date=11 July 2025 |website=[[GitHub]] |language=en |archive-date=16 November 2015 |archive-url=https://web.archive.org/web/20151116175401/https://github.com/git/git/commit/e83c5163316f89bfbde7d9ab23ca2e25604af290 |url-status=live }}</ref>

== Characteristics ==

=== Design ===
Git's design is a synthesis of Torvalds's experience with Linux in maintaining a large distributed development project, along with his intimate knowledge of file-system performance gained from the same project and the urgent need to produce a working system in short order. These influences led to the following implementation choices:<ref name="pro-git-1.2"/>
; Strong support for non-linear development: Git supports rapid branching and merging, and includes specific tools for visualizing and navigating a non-linear development history. In Git, a core assumption is that a change will be merged more often than it is written, as it is passed around to various reviewers. In Git, branches are very lightweight: a branch is only a reference to one commit.
; Distributed development: Like [[Darcs]], [[BitKeeper]], [[Mercurial]], [[GNU Bazaar|Bazaar]], and [[Monotone (software)|Monotone]], Git gives each developer a local copy of the full development history, and changes are copied from one such repository to another. These changes are imported as added development branches and can be merged in the same way as a locally developed branch.<ref>{{cite web |title=Git – Distributed Workflows |url=https://git-scm.com/book/en/v2/Distributed-Git-Distributed-Workflows |website=Git |access-date=15 June 2020 |archive-date=22 October 2014 |archive-url=https://web.archive.org/web/20141022020026/http://git-scm.com/book/en/Distributed-Git-Distributed-Workflows |url-status=live }}</ref>
; Compatibility with existing systems and protocols: Repositories can be published via [[HTTPS|Hypertext Transfer Protocol Secure]] (HTTPS), [[Hypertext Transfer Protocol]] (HTTP), [[File Transfer Protocol]] (FTP), or a Git protocol over either a plain socket or [[Secure Shell]] (ssh). Git also has a CVS server emulation, which enables the use of existing CVS clients and IDE plugins to access Git repositories. [[Apache Subversion|Subversion]] repositories can be used directly with git-svn.<ref>{{Cite web|last=Gunjal|first=Siddhesh|date=2019-07-19|title=What is Version Control Tool? Explore Git and GitHub|url=https://medium.com/analytics-vidhya/what-is-version-control-tool-explore-git-and-github-e8c4e719bc05|access-date=2020-10-25|website=Medium|language=en|archive-date=17 April 2025|archive-url=https://web.archive.org/web/20250417123229/https://medium.com/analytics-vidhya/what-is-version-control-tool-explore-git-and-github-e8c4e719bc05|url-status=live}}</ref>
; Efficient handling of large projects: Torvalds has described Git as being very fast and scalable,<ref>{{cite mailing list |last=Torvalds |first=Linus |url=https://marc.info/?l=git&m=116128307511686 |title=Re: VCS comparison table |date=2006-10-19 |mailing-list=git |access-date=3 February 2017 |archive-date=18 June 2017 |archive-url=https://web.archive.org/web/20170618081422/https://marc.info/?l=git&m=116128307511686 |url-status=live }}</ref> and performance tests done by Mozilla<ref>Jst's Blog on Mozillazine {{cite web|title=bzr/hg/git performance |url=http://weblogs.mozillazine.org/jst/archives/2006/11/vcs_performance.html |access-date=12 February 2015 |url-status=dead |archive-url=https://web.archive.org/web/20100529094107/http://weblogs.mozillazine.org/jst/archives/2006/11/vcs_performance.html |archive-date=29 May 2010}}</ref> showed that it was an [[order of magnitude]] faster diffing large repositories than [[Mercurial]] and [[GNU Bazaar]]; fetching version history from a locally stored repository can be one hundred times faster than fetching it from the remote server.<ref>{{cite web |last=Dreier |first=Roland |url=http://digitalvampire.org/blog/index.php/2006/11/16/oh-what-a-relief-it-is/ |title=Oh what a relief it is |date=2006-11-13 |url-status=live |archive-url=https://web.archive.org/web/20090116175841/http://digitalvampire.org/blog/index.php/2006/11/16/oh-what-a-relief-it-is/ |archive-date=16 January 2009}}, observing that "git log" is 100x faster than "svn log" because the latter must contact a remote server.</ref>
; Cryptographic authentication of history: The Git history is stored in such a way that the ID of a particular version (a ''commit'' in Git terms) depends upon the complete development history leading up to that commit. Once it is published, it is not possible to change the old versions without it being noticed. The structure is similar to a [[Merkle tree]], but with added data at the nodes and leaves.<ref>{{cite web |url=https://www.kernel.org/pub/software/scm/git/docs/user-manual.html#trust |work=Git Concepts |publisher=Git User's Manual |title=Trust |date=2006-10-18 |url-status=live |archive-url=https://web.archive.org/web/20170222053056/https://www.kernel.org/pub/software/scm/git/docs/user-manual.html#trust |archive-date=22 February 2017}}</ref> ([[Mercurial]] and [[Monotone (software)|Monotone]] also have this property.)
; Toolkit-based design: Git was designed as a set of programs written in [[C (programming language)|C]] and several shell scripts that provide wrappers around those programs.<ref>{{cite mailing list |mailing-list=git |last=Torvalds |first=Linus |url=https://marc.info/?l=git&m=116118369005954 |title=Re: VCS comparison table |access-date=2009-04-10 |archive-date=11 April 2016 |archive-url=https://web.archive.org/web/20160411135351/http://marc.info/?l=git&m=116118369005954 |url-status=live }}, describing Git's script-oriented design</ref> Although most of those scripts have since been rewritten in C for speed and portability, the design remains, and it is easy to chain the components together.<ref>{{cite web |author=iabervon |url=https://lwn.net/Articles/165202/ |title=Git rocks! |date=2005-12-22 |url-status=live |archive-url=https://web.archive.org/web/20160914100946/https://lwn.net/Articles/165202/ |archive-date=14 September 2016}}, praising Git's scriptability.</ref>
; Pluggable merge strategies: As part of its toolkit design, Git has a well-defined model of an incomplete merge, and it has multiple algorithms for completing it, culminating in telling the user that it is unable to complete the merge automatically and that manual editing is needed.<ref>{{Cite web|title=Git – Git SCM Wiki|url=https://git.wiki.kernel.org/index.php/Git|access-date=2020-10-25|website=git.wiki.kernel.org|archive-date=6 February 2010|archive-url=https://web.archive.org/web/20100206125507/http://git.wiki.kernel.org/index.php/Git|url-status=live}}</ref>
; [[Garbage (computer science)|Garbage]] accumulates until collected: Aborting operations or backing out changes will leave useless dangling objects in the database. These are generally a small fraction of the continuously growing history of wanted objects. Git will automatically perform [[garbage collection (computer science)|garbage collection]] when enough loose objects have been created in the repository. Garbage collection can be called explicitly using <code>git gc</code>.{{sfn | Chacon | Straub | 2014 | p=}}<ref>{{cite web |url=https://mirrors.edge.kernel.org/pub/software/scm/git/docs/git-gc.html |title=Git User's Manual |date=2020-03-10 |url-status=live |archive-url=https://web.archive.org/web/20200510190720/https://mirrors.edge.kernel.org/pub/software/scm/git/docs/git-gc.html |archive-date=10 May 2020}}</ref>
; Periodic explicit object packing: Git stores each newly created object as a separate file. Although individually compressed, this takes up a great deal of space and is inefficient. This is solved by the use of ''packs'' that store a large number of objects [[Delta encoding|delta-compressed]] among themselves in one file (or network byte stream) called a ''packfile''. Packs are compressed using the [[Heuristic (computer science)|heuristic]] that files with the same name are probably similar, without depending on this for correctness. A corresponding index file is created for each packfile, recording the offset of each object in the packfile. Newly created objects (with newly added history) are still stored as single objects, and periodic repacking is needed to maintain space efficiency. The process of packing the repository can be very computationally costly. By allowing objects to exist in the repository in a loose but quickly generated format, Git allows the costly pack operation to be deferred until later, when time matters less, e.g., the end of a workday. Git does periodic repacking automatically, but manual repacking is also possible with the <code>git gc</code> command.{{sfn | Chacon | Straub | 2014 | p=499}} For data integrity, both the packfile and its index have an [[SHA-1]] checksum{{sfn | Chacon | Straub | 2014 | pp=33-34}} inside, and the file name of the packfile also contains an SHA-1 checksum. To check the integrity of a repository, run the <code>git fsck</code> command.<ref name="Git - Packfiles">{{cite web |title=Git – Packfiles |url=https://git-scm.com/book/en/v2/Git-Internals-Packfiles |website=Git |access-date=25 August 2025 |archive-date=26 July 2025 |archive-url=https://web.archive.org/web/20250726094519/https://git-scm.com/book/en/v2/Git-Internals-Packfiles |url-status=live }}</ref>{{sfn | Chacon | Straub | 2014 | p=568}}

Another property of Git is that it snapshots directory trees of files. The earliest systems for tracking versions of source code, [[Source Code Control System]] (SCCS) and [[Revision Control System]] (RCS), worked on individual files and emphasized the space savings to be gained from [[interleaved deltas]] (SCCS) or [[delta encoding]] (RCS) the (mostly similar) versions. Later revision-control systems maintained this notion of a file having an identity across multiple revisions of a project. However, Torvalds rejected this concept.<ref>{{cite mailing list |mailing-list=linux-kernel |last=Torvalds |first=Linus |url=https://marc.info/?l=linux-kernel&m=111314792424707 |title=Re: more git updates.. |date=2005-04-10 |access-date=3 February 2017 |archive-date=18 June 2017 |archive-url=https://web.archive.org/web/20170618081751/https://marc.info/?l=linux-kernel&m=111314792424707 |url-status=live }}</ref> Consequently, Git does not explicitly record file revision relationships at any level below the source-code tree.

==== Downsides ====
These implicit revision relationships have some significant consequences:
* It is slightly more costly to examine the change history of one file than the whole project.<ref>{{cite mailing list |mailing-list=git |last=Haible |first=Bruno |url=https://marc.info/?l=git&m=117119479505638 |title=how to speed up 'git log'? |date=2007-02-11 |access-date=3 February 2017 |archive-date=18 June 2017 |archive-url=https://web.archive.org/web/20170618081726/https://marc.info/?l=git&m=117119479505638 |url-status=live }}</ref> To obtain a history of changes affecting a given file, Git must walk the global history and then determine whether each change modified that file. This method of examining history does, however, let Git produce with equal efficiency a single history showing the changes to an arbitrary set of files. For example, a subdirectory of the source tree plus an associated global header file is a very common case.
* Renames are handled implicitly rather than explicitly. A common complaint with [[Concurrent Versions System|CVS]] is that it uses the name of a file to identify its revision history, so moving or renaming a file is not possible without either interrupting its history or renaming the history and thereby making the history inaccurate. Most post-CVS revision-control systems solve this by giving a file a unique long-lived name (analogous to an [[inode]] number) that survives renaming. Git does not record such an identifier, and this is claimed as an advantage.<ref>{{cite mailing list |mailing-list=git |last=Torvalds |first=Linus |url=https://marc.info/?l=git&m=114123702826251 |title=Re: impure renames / history tracking |date=2006-03-01 |access-date=3 February 2017 |archive-date=3 May 2017 |archive-url=https://web.archive.org/web/20170503141104/http://marc.info/?l=git&m=114123702826251 |url-status=live }}</ref><ref>{{cite mailing list |mailing-list=git |last=Hamano |first=Junio C. |url=https://marc.info/?l=git&m=114316047119262 |title=Re: Errors GITtifying GCC and Binutils |date=2006-03-24 |access-date=3 February 2017 |archive-date=18 June 2017 |archive-url=https://web.archive.org/web/20170618081433/https://marc.info/?l=git&m=114316047119262 |url-status=live }}</ref> [[Source code]] files are sometimes split or merged, or simply renamed,<ref>{{cite mailing list |mailing-list=git |last=Hamano |first=Junio C. |url=https://marc.info/?l=git&m=114315795227271 |title=Re: Errors GITtifying GCC and Binutils |date=2006-03-23 |access-date=3 February 2017 |archive-date=18 June 2017 |archive-url=https://web.archive.org/web/20170618081520/https://marc.info/?l=git&m=114315795227271 |url-status=live }}</ref> and recording this as a simple rename would freeze an inaccurate description of what happened in the (immutable) history. Git addresses the issue by detecting renames while browsing the history of snapshots rather than recording it when making the snapshot.<ref>{{cite mailing list |mailing-list=git |last=Torvalds |first=Linus |url=https://marc.info/?l=git&m=116473016012824 |title=Re: git and bzr |date=2006-11-28 |access-date=3 February 2017 |archive-date=18 June 2017 |archive-url=https://web.archive.org/web/20170618081410/https://marc.info/?l=git&m=116473016012824 |url-status=live }}, on using <code>git-blame</code> to show code moved between source files.</ref> (Briefly, given a file in revision ''N'', a file of the same name in revision ''N''&nbsp;−&nbsp;1 is its default ancestor. However, when there is no like-named file in revision ''N''&nbsp;−&nbsp;1, Git searches for a file that existed only in revision ''N''&nbsp;−&nbsp;1 and is very similar to the new file.) However, it does require more [[CPU]]-intensive work every time the history is reviewed, and several options to adjust the heuristics are available. This mechanism does not always work; sometimes a file that is renamed with changes in the same commit is read as a deletion of the old file and the creation of a new file. Developers can work around this limitation by committing the rename and the changes separately.

=== Merging strategies ===
Git implements several merging strategies; a non-default strategy can be selected at merge time:<ref>{{cite web |last=Torvalds |first=Linus |url=https://www.kernel.org/pub/software/scm/git/docs/git-merge.html |title=git-merge(1) |date=2007-07-18 |url-status=live |archive-url=https://web.archive.org/web/20160716100147/https://www.kernel.org/pub/software/scm/git/docs/git-merge.html |archive-date=16 July 2016}}</ref>
* ''resolve'': the traditional [[three-way merge]] algorithm.
* ''recursive'': This is the default when pulling or merging one branch, and is a variant of the three-way merge algorithm. {{Blockquote|When there are more than one common ancestors that can be used for a three-way merge, it creates a merged tree of the common ancestors and uses that as the reference tree for the three-way merge. This has been reported to result in fewer merge conflicts without causing mis-merges by tests done on prior merge commits taken from Linux 2.6 kernel development history. Also, this can detect and handle merges involving renames.|Linus Torvalds<ref>{{cite web |last=Torvalds |first=Linus |url=http://revctrl.org/CrissCrossMerge |title=CrissCrossMerge |date=2007-07-18 |url-status=dead |archive-url=https://web.archive.org/web/20060113122252/http://revctrl.org/CrissCrossMerge |archive-date=13 January 2006}}</ref>}}
* ''octopus'': This is the default when merging more than two heads.

===Data structures===
Git's primitives are not inherently a [[Version control|source-code management]] system. Torvalds explains:<ref>{{cite mailing list |mailing-list=linux-kernel |last=Torvalds |first=Linus |url=https://marc.info/?l=linux-kernel&m=111314792424707 |title=Re: more git updates... |date=2005-04-10 |access-date=3 February 2017 |archive-date=18 June 2017 |archive-url=https://web.archive.org/web/20170618081751/https://marc.info/?l=linux-kernel&m=111314792424707 |url-status=live }}</ref>
{{Blockquote|In many ways you can just see git as a filesystem—it's [[Content-addressable storage|content-addressable]], and it has a notion of versioning, but I really designed it coming at the problem from the viewpoint of a ''filesystem'' person (hey, kernels is what I do), and I actually have absolutely ''zero'' interest in creating a traditional SCM system.}}

From this initial design approach, Git has developed the full set of features expected of a traditional SCM,<ref name="bare_url">{{cite mailing list |mailing-list=git |last=Torvalds |first=Linus |url=https://marc.info/?l=git&m=114314642000462 |title=Re: Errors GITtifying GCC and Binutils |date=2006-03-23 |access-date=3 February 2017 |archive-date=22 March 2021 |archive-url=https://web.archive.org/web/20210322043017/https://marc.info/?l=git&m=114314642000462 |url-status=live }}</ref> with features mostly being created as needed, then refined and extended over time.

[[File:Git operations.svg|thumb|Some data flows and storage levels in the Git revision control system]]

Git has two [[data structure]]s: a mutable ''index'' (also called ''stage'' or ''cache'') that caches information about the [[working directory]] and the next revision to be committed; and an ''object database'' that stores immutable objects.<ref name=":3">{{Cite web |title=Git - Git Objects |url=https://git-scm.com/book/ms/v2/Git-Internals-Git-Objects |access-date=2026-04-01 |website=git-scm.com}}</ref>

The index serves as a connection point between the [[object database]] and the working tree.<ref name=":3" />

The [[object store]] contains five types of objects:<ref>{{cite web |title=Git – Git Objects |url=https://git-scm.com/book/en/v2/Git-Internals-Git-Objects |website=Git |access-date=25 August 2025 |archive-date=29 July 2025 |archive-url=https://web.archive.org/web/20250729041528/https://git-scm.com/book/en/v2/Git-Internals-Git-Objects |url-status=live }}</ref><ref name="Git - Packfiles"/>
* A '''blob''' is the content of a [[computer file|file]]. Blobs have no proper file name, time stamps, or other metadata (a blob's name internally is a hash of its content). In Git, each blob is a version of a file, in which is the file's data.{{sfn | Chacon | Straub | 2014 | pp=81-83}}
* A '''tree''' object is the equivalent of a directory. It contains a list of file names,{{sfn | Chacon | Straub | 2014 | pp=485-488}} each with some type bits and a reference to a blob or tree object that is that file, symbolic link, or directory's contents. These objects are a snapshot of the source tree. (In whole, this comprises a [[Merkle tree]], meaning that only a single hash for the root tree is sufficient and actually used in commits to precisely pinpoint to the exact state of whole tree structures of any number of sub-directories and files.)
* A '''commit''' object links tree objects together into history. It contains the name of a tree object (of the top-level source directory), a timestamp, a log message, and the names of zero or more parent commit objects.{{sfn | Chacon | Straub | 2014 | pp=488-490}}
* A '''tag''' object is a container that contains a reference to another object and can hold added meta-data related to another object. Most commonly, it is used to store a [[digital signature]] of a commit object corresponding to a particular release of the data being tracked by Git.{{sfn | Chacon | Straub | 2014 | pp=495-496}}
* A '''packfile''' object collects various other objects into a [[zlib]]-compressed bundle for compactness and ease of transport over network protocols.{{sfn | Chacon | Straub | 2014 | pp=497-501}}

Each object is identified by a SHA-1 [[Cryptographic hash function|hash]] of its contents. Git computes the hash and uses this value for the object's name. The object is put into a directory matching the first two characters of its hash. The rest of the hash is used as the file name for that object.

Git stores each revision of a file as a unique blob. The relationships between the blobs can be found through examining the tree and commit objects. Newly added objects are stored in their entirety using zlib compression. This can consume a large amount of disk space quickly, so objects can be combined into ''packs'', which use [[Delta encoding|delta compression]] to save space, storing blobs as their changes relative to other blobs.

Additionally, Git stores labels called refs (short for references) to indicate the locations of various commits. They are stored in the reference database and are respectively:<ref>{{cite web |title=Git – Git References |url=https://git-scm.com/book/en/v2/Git-Internals-Git-References |website=Git |access-date=25 August 2025 |archive-date=26 July 2025 |archive-url=https://web.archive.org/web/20250726094638/https://git-scm.com/book/en/v2/Git-Internals-Git-References |url-status=live }}</ref>
* '''Heads (branches)''': Named references that are advanced automatically to the new commit when a commit is made on top of them.
* '''HEAD''': A reserved head that will be compared against the working tree to create a commit.
* '''Tags''': Like branch references, but fixed to a particular commit. Used to label important points in history.

=== Commands ===
Frequently used commands for Git's [[command-line interface]] include:<ref>{{Cite web |title=Git Cheat Sheet |url=https://education.github.com/git-cheat-sheet-education.pdf |access-date=10 June 2024 |website=education.github.com |archive-date=19 June 2024 |archive-url=https://web.archive.org/web/20240619204742/https://education.github.com/git-cheat-sheet-education.pdf |url-status=live }}</ref><ref>{{Cite web |title=Git Tutorial |url=https://web.stanford.edu/class/cs124/lec/git_tutorial.pdf |access-date=10 June 2024 |website=web.stanford.edu |archive-date=10 June 2024 |archive-url=https://web.archive.org/web/20240610172749/https://web.stanford.edu/class/cs124/lec/git_tutorial.pdf |url-status=live }}</ref>

* <code>git init</code>, which is used to create a git repository.
* <code>git clone [URL]</code>, which ''clones'', or duplicates, a git repository from an external URL.
* <code>git add [file]</code>, which adds a file to git's ''index'' (files about to be committed).
* <code>git commit -m [commit message]</code>, which ''commits'' the files from the index (staging area) as a new snapshot, so they are now part of the repository's history.
A ''.gitignore'' file may be created in a Git repository as a plain [[text file]]. The files listed in the ''.gitignore'' file will ''not'' be tracked by Git.<ref>{{Cite web |title=Git Quick Intro |url=https://data-skills.github.io/tutorials/git.pdf |access-date=10 June 2024 |website=data-skills.github.io |archive-date=23 June 2024 |archive-url=https://web.archive.org/web/20240623002026/https://data-skills.github.io/tutorials/git.pdf |url-status=live }}</ref>{{Reference page|pages=3–4}} This feature can be used to ignore files with keys or passwords, various extraneous files, and large files (which [[GitHub]] will refuse to upload).<ref>{{Cite web |last=Ba Tran |first=Andrew |title=Best practices for uploading to GitHub |url=https://journalismcourses.org/wp-content/uploads/2020/08/github_pages.pdf |access-date=10 June 2024 |website=journalismcourses.org |archive-date=10 September 2024 |archive-url=https://web.archive.org/web/20240910081117/https://journalismcourses.org/wp-content/uploads/2020/08/github_pages.pdf |url-status=live }}</ref>

===Git references===
Every object in the Git database that is not referred to may be cleaned up by using a garbage collection command or automatically. An object may be referenced by another object or an explicit reference. Git has different types of references. The commands to create, move, and delete references vary. <code>git show-ref</code> lists all references. Some types are:
* ''heads'': refers to an object locally,
* ''remotes'': refers to an object which exists in a remote repository,
* ''stash'': refers to an object not yet committed,
* ''meta'': ''e.g.'', a configuration in a bare repository, user rights; the refs/meta/config namespace was introduced retrospectively, gets used by [[Gerrit (software)|Gerrit]],<ref name="Gerrit Code Review">{{cite web | title=Project Configuration File Format | website=Gerrit Code Review | url=https://gerrit-review.googlesource.com/Documentation/config-project-config.html | access-date=2 February 2020 | archive-date=3 December 2020 | archive-url=https://web.archive.org/web/20201203033602/https://gerrit-review.googlesource.com/Documentation/config-project-config.html | url-status=live }}</ref>
* ''tags'': see above.

==Implementations==
[[File:GNOME gitg.png|thumb|[[GNOME Core Applications|gitg]] is a graphical front-end using [[GTK+]].]]

Git (the main implementation in C) is primarily developed on [[Linux]], although it also supports most major operating systems, including the BSDs ([[DragonFly BSD]], [[FreeBSD]], [[NetBSD]], and [[OpenBSD]]), [[Solaris (operating system)|Solaris]], [[macOS]], and [[Microsoft Windows|Windows]].<ref>{{cite web |url=https://git-scm.com/downloads |access-date=14 May 2012 |title=downloads |url-status=live |archive-url=https://web.archive.org/web/20120508021315/http://git-scm.com/downloads |archive-date=8 May 2012}}</ref><ref>{{cite web|access-date=30 November 2021|title=git package versions – Repology|url=https://repology.org/project/git/versions|url-status=dead|archive-date=19 January 2022|archive-url=https://web.archive.org/web/20220119103832/https://repology.org/project/git/versions}}</ref>

The first Windows [[porting|port]] of Git was primarily a Linux-emulation framework that hosts the Linux version. Installing Git under Windows creates a similarly named Program Files directory containing the [[Mingw-w64]] port of the [[GNU Compiler Collection]], [[Perl]] 5, [[MSYS2]] (itself a fork of [[Cygwin]], a Unix-like emulation environment for Windows) and various other Windows ports or emulations of Linux utilities and libraries. Currently, native Windows builds of Git are distributed as 32- and 64-bit installers.<ref>{{cite web |url=https://github.com/msysgit/msysgit|access-date=20 September 2016 |title=msysGit |website=[[GitHub]] |url-status=live |archive-url=https://web.archive.org/web/20161010143600/https://github.com/msysgit/msysgit |archive-date=10 October 2016}}</ref> The git official website currently maintains a build of Git for Windows, still using the MSYS2 environment.<ref>{{cite web |title=Git – Downloading Package |url=https://git-scm.com/download/win |website=Git |access-date=25 August 2025 |archive-date=29 July 2025 |archive-url=https://web.archive.org/web/20250729100630/https://git-scm.com/download/win |url-status=live }} ([https://github.com/git-for-windows/git source code] {{Webarchive|url=https://web.archive.org/web/20250726135143/https://github.com/git-for-windows/git |date=26 July 2025 }})</ref>

The JGit implementation of Git is a pure [[Java (software platform)|Java]] software library, designed to be embedded in any Java application. JGit is used in the [[Gerrit (software)|Gerrit]] code-review tool, and in EGit, a Git client for the [[Eclipse (software)|Eclipse]] IDE.<ref>{{cite web |url=https://www.eclipse.org/jgit/ |access-date=24 August 2012 |title=JGit |url-status=live |archive-url=https://web.archive.org/web/20120831201256/http://eclipse.org/jgit/ |archive-date=31 August 2012}}</ref>

Go-git is an [[Open-source software|open-source]] implementation of Git written in pure [[Go (programming language)|Go]].<ref>{{cite web|url=https://git-scm.com/book/en/v2/Appendix-B%3A-Embedding-Git-in-your-Applications-go-git|title=Git – go-git|website=Git|access-date=2019-04-19|archive-date=22 April 2025|archive-url=https://web.archive.org/web/20250422031046/https://git-scm.com/book/en/v2/Appendix-B:-Embedding-Git-in-your-Applications-go-git|url-status=live}}</ref> It is currently used for backing projects as a [[SQL]] interface for Git code repositories<ref>{{citation|title=SQL interface to Git repositories, written in Go.|url=https://github.com/src-d/gitbase|website=github.com|access-date=2019-04-19|archive-date=22 June 2025|archive-url=https://web.archive.org/web/20250622210407/https://github.com/src-d/gitbase|url-status=live}}</ref> and providing [[encryption]] for Git.<ref>{{cite web|url=https://keybase.io/blog/encrypted-git-for-everyone|title=Keybase launches encrypted git|website=keybase.io|access-date=2019-04-19|archive-date=16 May 2018|archive-url=https://web.archive.org/web/20180516041815/https://keybase.io/blog/encrypted-git-for-everyone|url-status=live}}</ref>

Dulwich is an implementation of Git written in pure [[Python (programming language)|Python]] with support for CPython 3.6 and later and Pypy.<ref>{{cite web |url=https://github.com/jelmer/dulwich/tree/8d124dc920a9c529f841888c4229f9bd508c2507?tab=readme-ov-file#supported-versions-of-python |access-date=29 April 2024 |title=Dulwich GitHub Repository README.md |website=[[GitHub]] |url-status=live |archive-url=https://web.archive.org/web/20240429015034/https://github.com/jelmer/dulwich#supported-versions-of-python |archive-date=29 April 2024}}</ref>

The libgit2 implementation of Git is an ANSI C software library with no other dependencies, which can be built on multiple platforms, including Windows, Linux, macOS, and BSD.<ref>{{cite web |url=https://github.com/libgit2/libgit2/blob/main/README.md |access-date=24 August 2012 |title=libgit2 |website=[[GitHub]] |url-status=live |archive-url=https://web.archive.org/web/20160411135623/https://github.com/libgit2/libgit2/blob/master/README.md |archive-date=11 April 2016}}</ref> It has bindings for many programming languages, including [[Ruby (programming language)|Ruby]], Python, and [[Haskell]].<ref>{{cite web |url=https://github.com/libgit2/rugged |access-date=24 August 2012 |title=rugged |website=[[GitHub]] |url-status=live |archive-url=https://web.archive.org/web/20130724042431/https://github.com/libgit2/rugged |archive-date=24 July 2013}}</ref><ref>{{cite web |url=https://github.com/libgit2/pygit2 |access-date=24 August 2012 |title=pygit2 |website=[[GitHub]] |url-status=live |archive-url=https://web.archive.org/web/20150805001221/https://github.com/libgit2/pygit2 |archive-date=5 August 2015}}</ref><ref>{{cite web |url=https://hackage.haskell.org/package/hlibgit2 |access-date=30 April 2013 |title=hlibgit2 |url-status=live |archive-url=https://web.archive.org/web/20130525064750/http://hackage.haskell.org/package/hlibgit2 |archive-date=25 May 2013}}</ref>

Other implementations of Git include JS-Git (a [[JavaScript]] implementation of a subset of Git),<ref>{{cite web |url=https://github.com/creationix/js-git |title=js-git: a JavaScript implementation of Git |website=[[GitHub]] |access-date=2013-08-13 |url-status=live |archive-url=https://web.archive.org/web/20130807173550/https://github.com/creationix/js-git |archive-date=7 August 2013}}</ref> Game of Trees (an open-source implementation of Git for the [[OpenBSD]] project),<ref>{{Cite web |title=Game of Trees |url=https://www.gameoftrees.org/ |access-date=2024-03-10 |website=gameoftrees.org |archive-date=18 July 2025 |archive-url=https://web.archive.org/web/20250718200057/https://gameoftrees.org/ |url-status=live }}</ref> git9 (an independent implementation of Git for [[Plan 9 from Bell Labs|Plan 9]] using the system native abstractions),<ref>{{Cite web |title=git webls |url=https://orib.dev/git/git9/HEAD/info.html |archive-url=https://web.archive.org/web/20250210184316/https://orib.dev/git/git9/HEAD/info.html |archive-date=10 February 2025 |access-date=2025-09-21 |website=orib.dev |url-status=live }}</ref><ref>{{Cite web |title=selfhosting git9 |url=https://orib.dev/githosting.html |archive-url=https://web.archive.org/web/20250210184406/https://orib.dev/githosting.html |archive-date=10 February 2025 |access-date=2025-09-21 |website=orib.dev |url-status=live }}</ref> and gitoxide (an implementation of Git written in pure [[Rust (programming language)|Rust]]).<ref>{{cite web |url=https://github.com/GitoxideLabs/gitoxide |access-date=18 December 2025 |title=gitoxide: a Rust implementation of Git |website=[[GitHub]] |url-status=live}}</ref>

==Git server==
[[File:Gitweb.png|thumb|Screenshot of gitweb interface showing a commit [[diff]] ]]

As Git is a distributed version control system, it could be used as a server out of the box. It is shipped with a built-in command <code>git daemon</code> which starts a simple TCP server running on the Git protocol.{{sfn | Chacon | Straub | 2014 | pp=138-139}}<ref>{{cite web|url=https://git-scm.com/book/en/v2/Git-on-the-Server-Git-Daemon|title=Git – Git Daemon|website=Git|access-date=2019-07-10|archive-date=30 May 2025|archive-url=https://web.archive.org/web/20250530033532/https://git-scm.com/book/en/v2/Git-on-the-Server-Git-Daemon|url-status=live}}</ref> Dedicated Git HTTP servers help (amongst other features) by adding access control, displaying the contents of a Git repository via the web interfaces, and managing multiple repositories. Already existing Git repositories can be cloned and shared to be used by others as a centralized repo. It can also be accessed via remote shell just by having the Git software installed and allowing a user to log in.<ref>[https://git-scm.com/book/en/Git-on-the-Server-Setting-Up-the-Server 4.4 Git on the Server – Setting Up the Server] {{webarchive|url=https://web.archive.org/web/20141022015944/http://git-scm.com/book/en/Git-on-the-Server-Setting-Up-the-Server |date=22 October 2014}}, Pro Git.</ref> Git servers typically listen on [[Port (computer networking)|TCP port]] 9418.<ref>{{cite web |url=https://git-scm.com/book/ch4-1.html#The-Git-Protocol |title=1.4 Getting Started – Installing Git |publisher=Git |access-date=2013-11-01 |url-status=live |archive-url=https://web.archive.org/web/20131102192025/http://git-scm.com/book/ch4-1.html#The-Git-Protocol |archive-date=2 November 2013}}</ref>

For Web-based repository browsing, Git is also shipped with gitweb, a CGI-based interface for viewing repository contents over HTTP.<ref>{{Cite web |title=Git - gitweb Documentation |url=https://git-scm.com/docs/gitweb |access-date=2026-03-13 |website=git-scm.com}}</ref>

===Open source===
* Hosting the Git server using the Git Binary.<ref>{{cite book|chapter-url=https://git-scm.com/book/en/v2/Git-on-the-Server-Setting-Up-the-Server|chapter=Git on the Server – Setting Up the Server|first1=Scott|last1=Chacon|first2=Ben|last2=Straub|title=Pro Git|publisher=Apress|year=2014|isbn=978-1484200773|edition=2nd|archive-date=30 July 2025|access-date=25 August 2025|archive-url=https://web.archive.org/web/20250730003536/https://git-scm.com/book/en/v2/Git-on-the-Server-Setting-Up-the-Server|url-status=live}}</ref>
* [[Gerrit (software)|Gerrit]], a Git server configurable to support code reviews and provide access via ssh, an integrated [[Apache MINA]] or OpenSSH, or an integrated [[Jetty (web server)|Jetty]] [[web server]]. Gerrit provides integration for LDAP, Active Directory, OpenID, OAuth, Kerberos/GSSAPI, X509 https client certificates. With Gerrit 3.0 all configurations will be stored as Git repositories, and no database is required to run. Gerrit has a pull-request feature implemented in its core but lacks a GUI for it.
* [[Phabricator]], a spin-off from Facebook. As Facebook primarily uses [[Mercurial]], Git support is not as prominent.<ref>[https://secure.phabricator.com/book/phabricator/article/diffusion_hosting/ Diffusion User Guide: Repository Hosting] {{Webarchive|url=https://web.archive.org/web/20200920235815/https://secure.phabricator.com/book/phabricator/article/diffusion_hosting/ |date=20 September 2020 }}.</ref>
* [[RhodeCode]] Community Edition (CE), supporting Git, [[Mercurial]] and [[Apache Subversion|Subversion]] with an [[AGPLv3|AGPLv3 license]].
* [[Kallithea (software)|Kallithea]], supporting both Git and [[Mercurial]], developed in [[Python (programming language)|Python]] with [[GPL license]].
* External projects like gitolite,<ref>{{cite web|url=https://gitolite.com/gitolite/index.html|title=Gitolite: Hosting Git Repositories|access-date=25 August 2025|archive-date=13 June 2025|archive-url=https://web.archive.org/web/20250613033744/https://gitolite.com/gitolite/index.html|url-status=live}}</ref> which provide scripts on top of Git software to provide fine-grained access control.
* There are several other FLOSS solutions for self-hosting, including Gogs,<ref>{{cite web |url=https://gogs.io/ |title=Gogs: A painless self-hosted Git service |access-date=25 August 2025 |archive-date=25 July 2025 |archive-url=https://web.archive.org/web/20250725193147/https://gogs.io/ |url-status=live }}</ref> [[Gitea]], a fork of Gogs, as well as [[Forgejo]], which is, in turn, a fork of Gitea. Gogs, as well as the two aforementioned derivatives of it, is developed using the [[Go (programming language)|Go language]]. All three solutions are made available under the [[MIT license]].

===Git server as a service===
{{See also|Comparison of source-code-hosting facilities}}

There are many offerings of Git repositories as a service. The most popular are [[GitHub]], [[SourceForge]], [[Bitbucket]] and [[GitLab]].<ref name=":2">{{Cite web|date=2020-03-22|title=Highlights from Git 2.26|url=https://github.blog/2020-03-22-highlights-from-git-2-26/|access-date=2020-11-25|website=The GitHub Blog|language=en-US|quote=You may remember when Git introduced a new version of its network fetch protocol way back in 2018. That protocol is now used by default in 2.26, so let’s refresh ourselves on what that means. The biggest problem with the old protocol is that the server would immediately list all of the branches, tags, and other references in the repository before the client had a chance to send anything. For some repositories, this could mean sending megabytes of extra data, when the client really only wanted to know about the master branch. The new protocol starts with the client request and provides a way for the client to tell the server which references it’s interested in. Fetching a single branch will only ask about that branch, while most clones will only ask about branches and tags. This might seem like everything, but server repositories may store other references (such as the head of every pull request opened in the repository since its creation). Now, fetches from large repositories improve in speed, especially when the fetch itself is small, which makes the cost of the initial reference advertisement more expensive relatively speaking. And the best part is that you won’t need to do anything! Due to some clever design, any client that speaks the new protocol can work seamlessly with both old and new servers, falling back to the original protocol if the server doesn’t support it. The only reason for the delay between introducing the protocol and making it the default was to let early adopters discover any bugs.|archive-date=22 March 2021|archive-url=https://web.archive.org/web/20210322043004/https://github.blog/2020-03-22-highlights-from-git-2-26/|url-status=live}}</ref><ref name="Alexa github.com">{{cite web | title=github.com Competitive Analysis, Marketing Mix and Traffic | website=Alexa | url=https://www.alexa.com/siteinfo/github.com | access-date=2 February 2020 | archive-date=31 March 2013 | archive-url=https://web.archive.org/web/20130331175229/http://www.alexa.com/siteinfo/github.com | url-status=dead }}</ref><ref name="Alexa sourceforge.net">{{cite web | title=sourceforge.net Competitive Analysis, Marketing Mix and Traffic | website=Alexa | url=https://www.alexa.com/siteinfo/sourceforge.net | access-date=2 February 2020 | archive-date=20 October 2020 | archive-url=https://web.archive.org/web/20201020111244/https://www.alexa.com/siteinfo/sourceforge.net | url-status=live }}</ref><ref name="Alexa bitbucket.org">{{cite web | title=bitbucket.org Competitive Analysis, Marketing Mix and Traffic | website=Alexa | url=https://www.alexa.com/siteinfo/bitbucket.org | access-date=2 February 2020 | archive-date=23 June 2017 | archive-url=https://web.archive.org/web/20170623162208/http://www.alexa.com/siteinfo/bitbucket.org | url-status=dead }}</ref><ref name="Alexa gitlab.com">{{cite web | title=gitlab.com Competitive Analysis, Marketing Mix and Traffic | website=Alexa | url=https://www.alexa.com/siteinfo/gitlab.com | access-date=2 February 2020 | archive-date=30 November 2017 | archive-url=https://web.archive.org/web/20171130123149/https://www.alexa.com/siteinfo/gitlab.com | url-status=live }}</ref><!-- These are the four most popular in Alexa (as of 2 February 2020) sorted by decreasing order of popularity. Do not simply add random names to the list because you know they provide Git repositories: the article just needs a few relevant examples. [[User:BernardoSulzbach]] -->

== Graphical interfaces ==
Git GUI clients offer a graphical user interface (GUI) to simplify interaction with Git repositories.

These GUIs provide visual representations of project history, including branches, commits, and file changes. They also streamline actions like staging changes, creating commits, and managing branches. Visual diff tools help resolve merge conflicts arising from concurrent development.

Git comes with a [[Tcl/Tk]] [[Graphical user interface|GUI]], which allows users to perform actions such as creating and amending commits, creating and merging branches, and interacting with remote repositories.<ref>{{Cite web |url=https://git-scm.com/docs/git-gui |title=Git - git-gui Documentation |access-date=2024-07-01 |website=Git |language=en |archive-date=26 July 2025 |archive-url=https://web.archive.org/web/20250726094509/https://git-scm.com/docs/git-gui |url-status=live }}</ref>

In addition to the official GUI, many third-party interfaces exist that provide similar features to the official GUI distributed with Git.<ref>{{Cite web |url=https://git-scm.com/downloads/guis |title=Git - GUI Clients |access-date=2024-07-01 |website=Git |language=en |archive-date=28 July 2025 |archive-url=https://web.archive.org/web/20250728033137/https://git-scm.com/downloads/guis/ |url-status=live }}</ref>

GUI clients make Git easier to learn and use, improving workflow efficiency and reducing errors.

==Adoption==
The [[Eclipse Foundation]] reported in its annual community survey that {{as of|2014|5|lc=y}}, Git was the most widely used source-code management tool, with 42.9% of professional software developers reporting that they use Git as their primary source-control system<ref name="ianskerrett.wordpress.com">{{cite web |url=https://ianskerrett.wordpress.com/2014/06/23/eclipse-community-survey-2014-results/ |title=Eclipse Community Survey 2014 results &#124; Ian Skerrett |publisher=Ianskerrett.wordpress.com |date=2014-06-23 |access-date=2014-06-23 |url-status=live |archive-url=https://web.archive.org/web/20140625152145/http://ianskerrett.wordpress.com/2014/06/23/eclipse-community-survey-2014-results/ |archive-date=25 June 2014}}</ref> compared with 36.3% in 2013, 32% in 2012; or for Git responses excluding use of [[GitHub]]: 33.3% in 2014, 30.3% in 2013, 27.6% in 2012 and 12.8% in 2011.<ref>{{cite web |url=https://eclipse.org/org/community_survey/Survey_Final_Results_2012.xls |title=Results of Eclipse Community Survey 2012 |publisher=eclipse.org|url-status=live |archive-url=https://web.archive.org/web/20160411135719/http://www.eclipse.org/org/community_survey/Survey_Final_Results_2012.xls |archive-date=11 April 2016}}</ref> Open-source directory [[Open Hub]] reported a similar uptake among open-source projects.<ref>{{cite web |url=https://www.openhub.net/repositories/compare |title=Compare Repositories – Open Hub |url-status=live |archive-url=https://web.archive.org/web/20140907051024/https://www.openhub.net/repositories/compare |archive-date=7 September 2014}}</ref>

[[Stack Overflow]] has included [[version control]] in their annual developer survey<ref>{{cite web | url=https://insights.stackoverflow.com/survey | title=Stack Overflow Annual Developer Survey | publisher=Stack Exchange, Inc. | access-date=9 January 2020 | quote=Stack Overflow’s annual Developer Survey is the largest and most comprehensive survey of people who code around the world. Each year, we field a survey covering everything from developers' favorite technologies to their job preferences. This year marks the ninth year we’ve published our annual Developer Survey results, and nearly 90,000 developers took the 20-minute survey earlier this year.}}</ref> in 2015 (16,694 responses),<ref>{{cite web |title=Stack Overflow Developer Survey 2015 |url=https://insights.stackoverflow.com/survey/2015#tech-sourcecontrol |publisher=Stack Overflow |access-date=29 May 2019 |url-status=dead |archive-url=https://web.archive.org/web/20190504144447/https://insights.stackoverflow.com/survey/2015#tech-sourcecontrol |archive-date=4 May 2019}}</ref> 2017 (30,730 responses),<ref>{{cite web |title=Stack Overflow Developer Survey 2017 |url=https://insights.stackoverflow.com/survey/2017#work-_-version-control |publisher=Stack Overflow |access-date=29 May 2019 |url-status=dead |archive-url=https://web.archive.org/web/20190529004901/https://insights.stackoverflow.com/survey/2017#work-_-version-control |archive-date=29 May 2019}}</ref> 2018 (74,298 responses)<ref>{{cite web |title=Stack Overflow Developer Survey 2018 |url=https://insights.stackoverflow.com/survey/2018#work-_-version-control |publisher=Stack Overflow |access-date=29 May 2019 |url-status=dead |archive-url=https://web.archive.org/web/20190530142357/https://insights.stackoverflow.com/survey/2018/#work-_-version-control |archive-date=30 May 2019}}</ref> and 2022 (71,379 responses).<ref name=":1">{{Cite web |title=Stack Overflow Developer Survey 2022 |url=https://survey.stackoverflow.co/2022/#section-version-control-version-control-systems |access-date=2022-08-04 |website=Stack Overflow |language=en |archive-date=27 June 2022 |archive-url=https://web.archive.org/web/20220627034954/https://survey.stackoverflow.co/2022/#section-version-control-version-control-systems |url-status=live }}</ref> Git was the overwhelming favorite of responding developers in these surveys, reporting as high as 93.9% in 2022.

