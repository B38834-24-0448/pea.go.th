t Visual SourceSafe (VSS) Skills |publisher=Itjobswatch.co.uk |access-date=2016-09-30 |url-status=live |archive-url=https://web.archive.org/web/20161029043610/http://www.itjobswatch.co.uk/jobs/uk/vss/sourcesafe.do |archive-date=29 October 2016}}</ref>

===Extensions===
There are many ''Git extensions'', like Git LFS, which started as an extension to Git in the GitHub community and is now widely used by other repositories. Extensions are usually independently developed and maintained by different people, but at some point in the future, a widely used extension can be merged with Git.

Other open-source Git extensions include:

* [[git-annex]], a distributed file synchronization system based on Git
* [[git-flow]], a set of Git extensions to provide high-level repository operations for Vincent Driessen's branching model
* git-machete, a repository organizer & tool for automating rebase/merge/pull/push operations

Microsoft developed the [[Virtual File System for Git]] (VFS for Git; formerly Git Virtual File System or GVFS) extension to handle the size of the [[Microsoft Windows|Windows]] source-code tree as part of their 2017 migration from [[Perforce]]. VFS for Git allows cloned repositories to use placeholders whose contents are downloaded only once a file is accessed.<ref name="ars-windowsgit">{{cite web |title=Windows switch to Git almost complete: 8,500 commits and 1,760 builds each day |url=https://arstechnica.com/information-technology/2017/05/90-of-windows-devs-now-using-git-creating-1760-windows-builds-per-day/ |website=Ars Technica |date=24 May 2017 |access-date=24 May 2017 |url-status=live |archive-url=https://web.archive.org/web/20170524171707/https://arstechnica.com/information-technology/2017/05/90-of-windows-devs-now-using-git-creating-1760-windows-builds-per-day/ |archive-date=24 May 2017}}</ref>

==Conventions==
Git can be used in a variety of different ways, but some conventions are commonly adopted.

* The command to create a local repo, ''git init'', creates a branch named ''master''.{{sfn | Chacon | Straub | 2014 | pp=81-83}}<ref>{{cite web|url=https://git-scm.com/docs/git-init|title=git-init|work=Git|archive-url=https://web.archive.org/web/20220315095632/https://git-scm.com/docs/git-init|archive-date=March 15, 2022|url-status=live}}</ref> Often it is used as the integration branch for merging changes into.<ref>{{cite web |title=Git – Branches in a Nutshell |url=https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell#ch03-git-branching |website=Git |access-date=15 June 2020 |quote=The "master" branch in Git is not a special branch. It is exactly like any other branch. The only reason nearly every repository has one is that the git init command creates it by default and most people don’t bother to change it. |archive-date=20 December 2020 |archive-url=https://web.archive.org/web/20201220123258/http://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell#ch03-git-branching |url-status=live }}</ref> Some tools, such as GitHub<ref>{{Citation|title=github/renaming|date=2020-12-04|url=https://github.com/github/renaming|publisher=GitHub|access-date=2020-12-04|archive-date=26 July 2025|archive-url=https://web.archive.org/web/20250726123641/https://github.com/github/renaming|url-status=live}}</ref> and GitLab,<ref>{{Citation|title=Default branch name for new repositories now main|date=2021-06-22|url=https://about.gitlab.com/releases/2021/06/22/gitlab-14-0-released/#default-branch-name-for-new-repositories-now-main|publisher=GitLab|access-date=2021-06-22|archive-date=19 May 2025|archive-url=https://web.archive.org/web/20250519194943/https://about.gitlab.com/releases/2021/06/22/gitlab-14-0-released/#default-branch-name-for-new-repositories-now-main|url-status=live}}</ref> create a default branch named ''main'' instead; {{Update after|2027|01|text=Git  will start using ''main'' from the 3.0 release, expected by the end of 2026}}.<ref>{{Cite web |title=Git 2.52 Released With More Preparations Toward Git 3.0 |url=https://www.phoronix.com/news/Git-2.52-Released |access-date=2025-12-19 |website=www.phoronix.com |language=en}}</ref> Since the default upstream remote is named ''origin'',{{sfn | Chacon | Straub | 2014 | pp=103-109}} the default remote branch is ''origin/master''. Also, users can add and delete branches and choose any branch for integrating.
* Pushed commits generally are not overwritten, but are ''reverted''<ref>{{cite web |title=Git Revert {{!}} Atlassian Git Tutorial |url=https://www.atlassian.com/git/tutorials/undoing-changes/git-revert |website=Atlassian |language=en |quote=Reverting has two important advantages over resetting. First, it doesn’t change the project history, which makes it a "safe" operation for commits that have already been published to a shared repository. |access-date=25 August 2025 |archive-date=19 June 2025 |archive-url=https://web.archive.org/web/20250619070450/https://www.atlassian.com/git/tutorials/undoing-changes/git-revert |url-status=live }}</ref> by committing another change which reverses an earlier commit. This prevents shared commits from being invalid because the commit on which they are based does not exist in the remote. If the commits contain sensitive information, they should be removed, which involves a more complex procedure to rewrite history.
* The ''git-flow''<ref>{{cite web |title=Gitflow Workflow {{!}} Atlassian Git Tutorial |url=https://www.atlassian.com/git/tutorials/comparing-workflows/gitflow-workflow |website=Atlassian |access-date=15 June 2020 |language=en}}</ref> workflow and naming conventions are often adopted to distinguish feature-specific unstable histories (feature/*), unstable shared histories (develop), production-ready histories (main), and emergency patches to released products (hotfix).
* A ''pull request'', a.k.a. ''merge request'', is a request by a user to merge a branch into another branch.{{sfn | Chacon | Straub | 2014 | pp=170–174}}<ref>{{cite web |title=Forking Workflow {{!}} Atlassian Git Tutorial |url=https://www.atlassian.com/git/tutorials/comparing-workflows/forking-workflow |website=Atlassian |access-date=15 June 2020 |language=en |archive-date=24 June 2020 |archive-url=https://web.archive.org/web/20200624120524/https://www.atlassian.com/git/tutorials/comparing-workflows/forking-workflow |url-status=live }}</ref> Git does not provide for pull requests, but it is a common feature of git cloud services. The underlying function of a pull request is no different than that of an administrator of a repository pulling changes from another remote (the repository that is the source of the pull request). However, the pull request is a ticket managed by the hosting server, which perform these actions; it is not a feature of git SCM.

==Security==
Git does not provide access-control mechanisms, but was designed for operation with other tools that specialize in access control.<ref>{{cite web |url=https://wincent.com/wiki/git_repository_access_control |title=Git repository access control |access-date=2016-09-06 |url-status=live |archive-url=https://web.archive.org/web/20160914114143/https://wincent.com/wiki/git_repository_access_control |archive-date=14 September 2016}}</ref>

On 17 December 2014, an exploit was found affecting the [[Microsoft Windows|Windows]] and [[macOS]] versions of the Git client. An attacker could perform [[arbitrary code execution]] on a target computer with Git installed by creating a malicious Git tree (directory) named ''.git'' (a directory in Git repositories that stores all the data of the repository) in a different case (such as .GIT or .Git, needed because Git does not allow the all-lowercase version of ''.git'' to be created manually) with malicious files in the ''.git/hooks'' subdirectory (a folder with executable files that Git runs) on a repository that the attacker made or on a repository that the attacker can modify. If a Windows or Mac user ''pulls'' (downloads) a version of the repository with the malicious directory, then switches to that directory, the .git directory will be overwritten (due to the case-insensitive trait of the Windows and Mac filesystems) and the malicious executable files in ''.git/hooks'' may be run, which results in the attacker's commands being executed. An attacker could also modify the ''.git/config'' configuration file, which allows the attacker to create malicious Git aliases (aliases for Git commands or external commands) or modify extant aliases to execute malicious commands when run. The vulnerability was patched in version 2.2.1 of Git, released on 17 December 2014, and announced the next day.<ref>{{cite web |url= https://developer.atlassian.com/blog/2014/12/securing-your-git-server/ |title= Securing your Git server against CVE-2014-9390 |date= 20 December 2014 |access-date= 22 December 2014 |last= Pettersen |first= Tim |url-status= live |archive-url= https://web.archive.org/web/20141224012942/https://developer.atlassian.com/blog/2014/12/securing-your-git-server/ |archive-date= 24 December 2014}}</ref><ref>{{cite newsgroup |title=[Announce] Git v2.2.1 (and updates to older maintenance tracks) |author= Hamano, J. C.|date= 18 December 2014|newsgroup=gmane.linux.kernel |url=https://article.gmane.org/gmane.linux.kernel/1853266 |archive-url=https://web.archive.org/web/20141219024646/http://article.gmane.org/gmane.linux.kernel/1853266 |url-status=dead |archive-date=19 December 2014 |access-date=22 December 2014}}</ref>

Git version 2.6.1, released on 29 September 2015, contained a patch for a security vulnerability (CVE-2015-7545)<ref>{{cite web |url=https://people.canonical.com/~ubuntu-security/cve/2015/CVE-2015-7545.html |title=CVE-2015-7545 |date=15 December 2015 |access-date=26 December 2015 |url-status=live |archive-url=https://web.archive.org/web/20151226232616/http://people.canonical.com/~ubuntu-security/cve/2015/CVE-2015-7545.html |archive-date=26 December 2015}}</ref> that allowed arbitrary code execution.<ref name="git-v2.6.1-commit">{{cite web |url=https://github.com/git/git/commit/22f698cb188243b313e024d618283e0293e37140 |title=Git 2.6.1 |website=[[GitHub]] |access-date=26 December 2015 |date=29 September 2015 |url-status=live |archive-url=https://web.archive.org/web/20160411135802/https://github.com/git/git/commit/22f698cb188243b313e024d618283e0293e37140 |archive-date=11 April 2016}}</ref> The vulnerability was exploitable if an attacker could convince a victim to clone a specific URL, as the arbitrary commands were embedded in the URL.<ref name="seclists-CVE-2015-7545">{{cite web |url=http://seclists.org/oss-sec/2015/q4/67 |title=Re: CVE Request: git |author=Blake Burkhart |access-date=26 December 2015 |date=5 October 2015 |display-authors=etal |url-status=live |archive-url=https://web.archive.org/web/20151227054727/http://seclists.org/oss-sec/2015/q4/67 |archive-date=27 December 2015}}</ref> An attacker could use the exploit via a [[man-in-the-middle attack]] if the connection was unencrypted,<ref name="seclists-CVE-2015-7545"/> as they could redirect the user to a URL of their choice. Recursive clones were also vulnerable, since they allowed the controller of a repository to specify arbitrary URLs via the gitmodules file.<ref name="seclists-CVE-2015-7545"/>

Git uses [[SHA-1]] hashes internally. Linus Torvalds has responded that the hash was mostly to guard against accidental corruption, and the security a [[Cryptographic hash function|cryptographically secure hash]] gives was just an accidental side effect, with the main security being [[Digital signature|signing]] elsewhere.<ref>{{cite web |url=https://security.stackexchange.com/questions/67920/how-safe-are-signed-git-tags-only-as-safe-as-sha-1-or-somehow-safer |title=hash – How safe are signed git tags? Only as safe as SHA-1 or somehow safer? |publisher=Information Security Stack Exchange |date=22 September 2014 |url-status=live |archive-url=https://web.archive.org/web/20160624232415/https://security.stackexchange.com/questions/67920/how-safe-are-signed-git-tags-only-as-safe-as-sha-1-or-somehow-safer |archive-date=24 June 2016}}</ref><ref>{{cite web |url=https://stackoverflow.com/questions/28792784/why-does-git-use-a-cryptographic-hash-function |title=Why does Git use a cryptographic hash function? |publisher=Stack Overflow |date=1 March 2015 |url-status=live |archive-url=https://web.archive.org/web/20160701214638/http://stackoverflow.com/questions/28792784/why-does-git-use-a-cryptographic-hash-function |archive-date=1 July 2016}}</ref> Since a demonstration of the [[SHAttered]] attack against Git in 2017, Git was modified to use an SHA-1 variant resistant to this attack. A plan for hash function transition is being written since February 2020.<ref>{{cite web |title=Git – hash-function-transition Documentation |url=https://git-scm.com/docs/hash-function-transition/ |website=Git}}</ref>

