		<item>
		<title>Up and Coming ARIA </title>
		<link>https://webaim.org/blog/up-and-coming-aria/</link>
		
		<dc:creator><![CDATA[John Northup]]></dc:creator>
		<pubDate>Fri, 30 May 2025 18:19:41 +0000</pubDate>
				<category><![CDATA[Uncategorized]]></category>
		<guid isPermaLink="false">https://webaim.org/blog/?p=2795</guid>

					<description><![CDATA[If you work in web accessibility, you&#8217;ve probably spent a lot of time explaining and implementing the ARIA roles and attributes that have been around for years—things like aria-label, aria-labelledby, and role="dialog". But the ARIA landscape isn’t static. In fact, recent ARIA specifications (especially ARIA 1.3) include a number of emerging and lesser-known features that [&#8230;]]]></description>
										<content:encoded><![CDATA[
<p class="wp-block-paragraph">If you work in web accessibility, you&#8217;ve probably spent a lot of time explaining and implementing the ARIA roles and attributes that have been around for years—things like <code>aria-label</code>, <code>aria-labelledby</code>, and <code>role="dialog"</code>. But the ARIA landscape isn’t static. In fact, recent ARIA specifications (especially ARIA 1.3) include a number of emerging and lesser-known features that are quietly laying the groundwork for the next phase of inclusive web design. </p>



<p class="wp-block-paragraph">In this article, we’ll look at some of the <strong>“up and coming” ARIA features</strong>—some already supported, some just getting started, and some you might not have heard of. Think of these as tools to keep on your radar as browser and screen reader support continues to evolve.&nbsp;</p>



<h2 class="wp-block-heading">Environments Tested&nbsp;</h2>



<ul class="wp-block-list">
<li><strong>Windows 11: </strong>Current versions (May 2025) of JAWS, NVDA, and Narrator with Chrome, Firefox, and Edge. </li>
</ul>



<ul class="wp-block-list">
<li><strong>MacOS Sequoia: </strong>Current versions (May 2025) of VoiceOver with Safari, Chrome, and Firefox. </li>
</ul>



<ul class="wp-block-list">
<li><strong>iOS 18.4: </strong>VoiceOver with Safari. </li>
</ul>



<ul class="wp-block-list">
<li><strong>Android 15: </strong>TalkBack 15.2 with Chrome. </li>
</ul>



<h2 class="wp-block-heading">New and Notable ARIA Attributes&nbsp;</h2>



<h3 class="wp-block-heading">aria-errormessage&nbsp;</h3>



<p class="wp-block-paragraph">This attribute lets you explicitly associate a custom error message with a form field when <code>aria-invalid="true"</code> is present. Unlike <code>aria-describedby</code>, which is often used generically, <code>aria-errormessage</code> gets announced <em>only when</em> the field is invalid—making it purpose-built for form error feedback. </p>



<p class="wp-block-paragraph"><strong>Support:</strong> Strong across JAWS, NVDA, and iOS VoiceOver, but limited elsewhere.&nbsp;</p>



<h3 class="wp-block-heading">aria-description&nbsp;</h3>



<p class="wp-block-paragraph">This provides a programmatic description of an element that’s not necessarily visible on screen. It differs from <code>aria-describedby</code> in that it’s meant more as a <em>supplement</em>, such as content that is not visible in the page; not essential content. </p>



<p class="wp-block-paragraph">A practical example: a breadcrumb trail with <code>aria-description="You are here:"</code>—which offers helpful orientation to screen reader users without cluttering the visual design. </p>



<p class="wp-block-paragraph"><strong>Support:</strong> Surprisingly limited, with only NVDA and iOS VoiceOver currently handling it well.&nbsp;</p>



<h3 class="wp-block-heading">aria-details&nbsp;</h3>



<p class="wp-block-paragraph">This attribute points to detailed, supplementary content—kind of like a modern replacement for the old (and poorly supported) <code>longdesc</code> attribute. It is intended to contain more information than would normally be provided via <code>aria-describedby</code>. For instance, you might have a chart with <code>aria-details</code> referencing a nearby data table. </p>



<p class="wp-block-paragraph"><strong>Support:</strong> Announced in some screen readers, but there’s currently <em>no way</em> to access the details element directly from the element that references it. So, it’s more of a placeholder for future capability than a production-ready feature.&nbsp;</p>



<h3 class="wp-block-heading">aria-keyshortcuts&nbsp;</h3>



<p class="wp-block-paragraph">Want to communicate that a button is triggered with the Escape key, or that pressing “Ctrl+M” will mute audio? <code>aria-keyshortcuts</code> allows you to document keyboard shortcuts directly in the DOM. </p>



<p class="wp-block-paragraph">This doesn’t <em>enable</em> the shortcut—it just declares it. But for users navigating with screen readers, this can surface helpful hints they might not see otherwise.&nbsp;</p>



<p class="wp-block-paragraph"><strong>Support:</strong> Decent in Chrome and Edge, less so in Firefox and mobile environments.&nbsp;</p>



<h3 class="wp-block-heading">aria-placeholder&nbsp;</h3>



<p class="wp-block-paragraph">The HTML <code>placeholder</code> attribute adds text to an empty field. This text is read by a screen reader, even when the field is no longer empty. <code>aria-placeholder</code> text is read by the screen reader without adding the visible text and is particularly useful for custom widgets that simulate form fields. For example, if you build a <code>div[contenteditable]</code> component, you can add a prompt with <code>aria-placeholder</code> that matches the visible placeholder text.</p>



<p class="wp-block-paragraph"><strong>Support:</strong> Surprisingly consistent across major screen readers—including JAWS, NVDA, VoiceOver, and TalkBack.&nbsp;</p>



<h2 class="wp-block-heading">Lesser-Known ARIA Roles&nbsp;</h2>



<h3 class="wp-block-heading">role=&#8221;mark&#8221;, role=&#8221;comment&#8221;, and role=&#8221;suggestion&#8221;&nbsp;</h3>



<p class="wp-block-paragraph">These roles are especially useful for editorial and collaborative systems.&nbsp;</p>



<ul class="wp-block-list">
<li><code>role="mark"</code> = highlighted text </li>
</ul>



<ul class="wp-block-list">
<li><code>role="comment"</code> = user-generated feedback or discussion </li>
</ul>



<ul class="wp-block-list">
<li><code>role="suggestion"</code> = proposed content changes </li>
</ul>



<p class="wp-block-paragraph">Support is still inconsistent, though <code>role="mark"</code> (semantically equivalent to <code>&lt;mark></code>) is catching on. </p>



<h3 class="wp-block-heading">role=&#8221;code&#8221; and role=&#8221;time&#8221;&nbsp;</h3>



<p class="wp-block-paragraph">These mimic the semantics of <code>&lt;code></code> and <code>&lt;time></code> respectively and are useful in component-based systems where native tags aren’t practical. Support is limited. </p>



<h3 class="wp-block-heading">role=&#8221;image&#8221;&nbsp;</h3>



<p class="wp-block-paragraph">This one is more of a convenience: it’s just a synonym for <code>role="img"</code>. It doesn’t change behavior, but it can be useful for readability or design consistency when using roles that mirror natural language. </p>



<h2 class="wp-block-heading">Where Does This Leave Us?&nbsp;</h2>



<p class="wp-block-paragraph">Many of these features are in what you might call the <strong>&#8220;infrastructure stage&#8221;</strong>: they’re well-defined and ready to use <em>in theory</em>, but screen reader and browser support remains uneven. Still, that’s exactly when accessibility professionals should start paying attention—because by the time support is universal, the best practices will already be written.&nbsp;</p>



<p class="wp-block-paragraph">Until then, it’s important to know what’s possible, test across multiple environments, and deploy these newer features when they add real value and degrade gracefully.&nbsp;</p>



<h2 class="wp-block-heading">Want to Explore Some HTML Examples?&nbsp;</h2>



<p class="wp-block-paragraph">Check out the companion demo page here:&nbsp;<br><a href="https://webaim.org/presentations/2025/examples/up-and-coming-aria" target="_blank" rel="noreferrer noopener">webaim.org/presentations/2025/examples/up-and-coming-aria</a>&nbsp;</p>
]]></content:encoded>
					
		
		
			</item>
