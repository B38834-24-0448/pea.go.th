		<title>Global Digital Accessibility Salary Survey Results</title>
		<link>https://webaim.org/blog/salary-survey-results/</link>
					<comments>https://webaim.org/blog/salary-survey-results/#comments</comments>
		
		<dc:creator><![CDATA[Jared Smith]]></dc:creator>
		<pubDate>Thu, 27 Feb 2025 20:45:03 +0000</pubDate>
				<category><![CDATA[Uncategorized]]></category>
		<guid isPermaLink="false">https://webaim.org/blog/?p=2783</guid>

					<description><![CDATA[In December 2024 WebAIM conducted a survey to collect salary and job-related data from professionals whose job responsibilities primarily focus on making technology and digital products accessible and usable to people with disabilities. 656 responses were collected. The full survey results are now available. This survey was conducted in conjunction with the&#160;GAAD Foundation. The GAAD [&#8230;]]]></description>
										<content:encoded><![CDATA[
<p class="wp-block-paragraph">In December 2024 WebAIM conducted a survey to collect salary and job-related data from professionals whose job responsibilities primarily focus on making technology and digital products accessible and usable to people with disabilities. 656 responses were collected. <a href="https://webaim.org/projects/salary/">The full survey results are now available.</a></p>



<p class="wp-block-paragraph">This survey was conducted in conjunction with the&nbsp;<a href="https://gaad.foundation/">GAAD Foundation</a>. The GAAD Foundation is a nonprofit organization whose mission is to disrupt the culture of technology and digital product development to include accessibility as a core requirement.<br> <img decoding="async" style="width:323px;height:auto" src="https://webaim.org/projects/salary/media/GAAD-Fdn-Logo.png" alt="GAAD Foundation logo."></p>



<h2 class="wp-block-heading">Survey Results Highlights</h2>



<ul class="wp-block-list">
<li>Respondents that reported working full time reported an average salary of $109,542 US dollars (median = $96,100). Average salaries varied by country.</li>



<li>57.6% of respondents reported having a disability. Respondents with disabilities reported higher full-time salaries on average than respondents without disabilities.</li>



<li>Blind respondents had the highest average salary of all disability types. Respondents with motor disabilities were the only disability category that reported lower average salaries than respondents without disabilities.</li>



<li>65% of respondents reported working at companies or organizations with over 1000 people. Employees for larger companies/organizations generally reported notably higher average salaries.</li>



<li>Those who reported working in an office had notably lower salaries on average than respondents that reported working remotely or in hybrid environments.</li>



<li>22.5% of respondents worked for accessibility software, tools, or services companies. These respondents reported notably lower full-time salaries.</li>
</ul>



<p class="wp-block-paragraph">More results are available in <a href="https://webaim.org/projects/salary/">the full Salary Survey results report</a>.</p>
]]></content:encoded>
					
