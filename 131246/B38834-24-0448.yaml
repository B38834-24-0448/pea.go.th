<div class="notice user-block uw-ublock" style="background:var(--background-color-progressive-subtle, #f1f4fd); color: inherit; border:1px solid #468; padding:0.5em; margin:0.5em auto; min-height: 45px">[[File:Information.svg|left|45px|alt=icon]]บัญชีของคุณได้ถูกบล็อกจากการแก้ไขวิกิพีเดียเนื่องจากชื่อผู้ใช้ของคุณ ''Www.pea.or.th'' ขัดต่อ[[วิกิพีเดีย:ชื่อผู้ใช้|นโยบายชื่อผู้ใช้]]ของเรา '''ชื่อผู้ใช้ของคุณคือสาเหตุหลักที่ทำให้ถูกบล็อก''' คุณสามารถดำเนินการแก้ไขต่อได้หลังจากที่คุณได้ตั้งชื่อผู้ใช้ใหม่ที่สอดคล้องกับแนวปฏิบัติตามนโยบายชื่อผู้ใช้ซึ่งสรุปไว้ในด้านล่างนี้{{pb}}ตามนโยบายชื่อผู้ใช้ ชื่อผู้ใช้ควรบ่งบอกถึงการ''ระบุตัวตน''และ<u>ไม่ควร</u>บ่งบอกว่าเป็นกลุ่มหรือองค์กร การส่งเสริม ทำให้เข้าใจผิด (เช่น การระบุว่าถือสิทธิผู้ใช้พิเศษหรือเป็นบัญชี [[วิกิพีเดีย:บอต|"บอต"]] เว้นแต่จะได้รับการอนุมัติสำหรับวัตถุประสงค์ดังกล่าว) ส่อถึงการละเมิดหรือก่อกวน อย่างไรก็ดี ชื่อผู้ใช้ที่มีทั้งชื่อขององค์กรและชื่อที่ระบุตัวตนของคุณเป็นรายบุคคล เช่น "Sara Smith at XYZ Company", "Mark at WidgetsUSA" หรือ "FoobarFan87" อนุญาตให้ใช้ได้ แม้ว่าจะสัมพันธ์ต่อแนวปฏิบัติเกี่ยวกับ[[WP:COI|ผลประโยชน์ทับซ้อน]] {{pb}}คุณควรตั้งชื่อบัญชีใหม่ให้สอดคล้องกับ[[วิกิพีเดีย:ชื่อผู้ใช้|นโยบาย]]และ'''[[Special:Userlogin/signup|สร้างบัญชีใหม่ด้วยตัวคุณเอง]]''' อีกทางเลือกคือถ้าคุณได้ทำการแก้ไขไปก่อนหน้านี้และต้องการเก็บรักษา[[Special:MyContributions|การเข้ามีส่วนร่วมเดิม]]ของคุณไว้ในชื่อใหม่ คุณอาจแจ้งขอ'''[[วิกิพีเดีย:เปลี่ยนชื่อผู้ใช้|เปลี่ยนชื่อผู้ใช้]]''' โดย:

:# ส่งคำขอเปลี่ยนชื่อผู้ใช้ที่ [[พิเศษ:GlobalRenameRequest]] โดยระบุในการเปลี่ยนชื่อว่าเพื่อปฏิบัติตามนโยบายชื่อผู้ใช้ และชื่อผู้ใช้ใหม่ต้องไม่ขัดต่อนโยบายดังกล่าว
:# {{tlx|unblock-un|''ใส่ชื่อผู้ใช้ใหม่ตรงนี้''}} ด้านล่าง คุณควรดำเนินการตามขั้นตอนนี้เพราะถึงแม้ว่าคุณจะถูกบล็อกแต่โดยปกติคุณยังสามารถแก้ไขหน้าคุยของตัวเองได้ ถ้าไม่เป็นเช่นนั้นคุณอาจต้องติดต่อผู้ดูแลระบบที่ทำการบล็อกโดยคลิกที่ "ส่งอีเมลถึงผู้ใช้รายนี้" ในหน้าคุยของพวกเขา
:# คำขอขึ้นอยู่กับดุลยพินิจของผู้ดูแลระบบ คุณอาจได้รับการปลดบล็อกหลังจากยื่นคำขอเป็นระยะเวลา 24 ชั่วโมง
:# โปรดทราบว่าคุณสามารถใช้ชื่อที่ยังไม่มีการใช้เท่านั้น โปรดตรวจสอบ[[Special:CentralAuth|ที่นี้]]เพื่อดูชื่อที่ถูกใช้งานแล้ว บัญชีที่ถูกสร้างขึ้นใหม่จะได้รับการยอมรับทันที ดังนั้น'''อย่า'''สร้างบัญชีใหม่ก่อนที่จะแจ้งขอเปลี่ยนชื่อผู้ใช้ สำหรับข้อมูลเพิ่มเติม โปรดดู [[วิกิพีเดีย:เปลี่ยนชื่อผู้ใช้]]

